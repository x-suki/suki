  const { mx, my } = toLocal(ev);
  const n = nodeAt(mx, my);
  if (n) {
    n.pinned = false; n.fixed = false;
    G.alpha = Math.max(G.alpha, 0.4);
    toast('已解除固定:' + truncate(n.label, 14));
    ensureLoop();
  } else {
    fitView();
  }
});
canvas.addEventListener('wheel', (ev) => {
  ev.preventDefault();
  if (splitMode) return;
  zoomAt(Math.exp(-ev.deltaY * 0.0013), ev.clientX, ev.clientY);
}, { passive: false });

/* ---------- 提示气泡 ---------- */
const tooltip = $('tooltip');
function showTooltip(n, cx, cy) {
  const key = $('ttKey'), title = $('ttTitle'), sub = $('ttSub');
  key.style.background = TYPE_META[n.type].color;
  key.style.borderRadius = n.type === 'tag' ? '2px' : '50%';
  if (n.type === 'excerpt') {
    const e = n.ref;
    title.textContent = truncate(e.text.replace(/\s+/g, ' '), 30);
    sub.textContent = '《' + e.book + '》' + (e.author ? ' ' + e.author : '') + ' · 摘录';
  } else if (n.type === 'book') {
    title.textContent = '《' + n.ref.title + '》';
    sub.textContent = (n.ref.author || '佚名') + ' · ' + n.ref.items.length + ' 条摘录';
  } else {
    title.textContent = '#' + n.ref.name;
    sub.textContent = n.ref.items.length + ' 条摘录';
  }
  tooltip.style.display = 'block';
  const r = tooltip.getBoundingClientRect();
  let x = cx + 16, y = cy + 18;
  if (x + r.width > W - 10) x = cx - r.width - 14;
  if (y + r.height > H - 10) y = cy - r.height - 14;
  tooltip.style.left = x + 'px';
  tooltip.style.top = y + 'px';
}
function hideTooltip() { tooltip.style.display = 'none'; tooltipTarget = null; }

/* ---------- 选中与详情面板 ---------- */
function selectNode(n) {
  G.selectedId = n.id;
  computeFocus();
  render();
  openDetail(n);
  hideTooltip();
}
function openDetail(n) {
  const body = $('detailBody');
  body.textContent = '';
  const meta = TYPE_META[n.type];
  $('detailHead').textContent = meta.name + '详情';

  const badge = el('span', 'badge');
  const bi = el('i'); bi.style.background = meta.color;
  badge.append(bi, document.createTextNode(meta.name));
  body.appendChild(badge);

  if (n.type === 'excerpt') {
    const e = n.ref;
    body.appendChild(el('p', 'quote', e.text));
    const dl = el('dl', 'meta');
    const addRow = (label, nodeChild) => {
      const dt = el('dt', null, label);
      const dd = el('dd'); dd.appendChild(nodeChild);
      dl.append(dt, dd);
    };
    const bookLink = el('span', 'link', '《' + e.book + '》');
    bookLink.onclick = () => { const bn = G.nodeById.get('b:' + bookKey(e.book)); if (bn) selectNode(bn); else enterBookView(e.book); };
    addRow('书籍', bookLink);
    addRow('作者', document.createTextNode(e.author || '—'));
    addRow('录入于', document.createTextNode(fmtDate(e.createdAt)));
    body.appendChild(dl);
    if (e.tags.length) {
      body.appendChild(el('div', 'note-label', '主题标签'));
      const chips = el('div', 'chips');
      for (const t of e.tags) {
        const c = el('span', 'chip');
        const i = el('i');
        c.append(i, document.createTextNode(t));
        c.onclick = () => { const tn = G.nodeById.get('t:' + t.toLowerCase()); if (tn) selectNode(tn); };
        chips.appendChild(c);
      }
      body.appendChild(chips);
    }
    if (e.note) {
      body.appendChild(el('div', 'note-label', '心得'));
      body.appendChild(el('div', 'note', e.note));
    }
    const acts = el('div', 'panel-actions');
    const bLoc = el('button', 'btn', '在图中定位');
    bLoc.onclick = () => centerOn(n);
    acts.appendChild(bLoc);
    if (editorMode) {
      const bEdit = el('button', 'btn', '编辑');
      bEdit.onclick = () => openEdit(e);
      const bDel = el('button', 'btn danger', '删除');
      bDel.onclick = () => confirmDelete(e);
      acts.append(bEdit, bDel);
    }
    body.appendChild(acts);
  } else {
    // 书籍 / 主题
    const isBook = n.type === 'book';
    const h = el('h3', null, isBook ? '《' + n.ref.title + '》' : '#' + n.ref.name);
    h.style.cssText = 'font-size:19px;font-weight:650;margin:14px 0 4px;';
    body.appendChild(h);
    if (isBook && n.ref.author) body.appendChild(el('p', null, n.ref.author)).style.cssText = 'color:var(--text-muted);font-size:13px;margin-bottom:8px;';
    body.appendChild(el('p', null, '共 ' + n.ref.items.length + ' 条摘录')).style.cssText = 'color:var(--text-muted);font-size:12.5px;margin-bottom:14px;';
    if (isBook) {
      // 合集区:自动(作者)chip + 手动 chips;点击 chip → 列表按该合集过滤;editor 可移除/加合
      const chips = el('div', 'chips');
      let has = false;
      if (n.ref.author) {
        has = true;
        const ac = el('span', 'chip collchip auto');
        ac.append(el('i', 'hex'), document.createTextNode('作者合集 · ' + n.ref.author));
        ac.title = '同名作者名下的书籍自动归入此合集';
        ac.onclick = () => openListColl({ auto: true, name: n.ref.author });
        chips.appendChild(ac);
      }
      for (const c of state.collections.filter(c => collHasBook(c, n.ref.title))) {
        has = true;
        const cc = el('span', 'chip collchip');
        cc.append(el('i', 'hex'), document.createTextNode(c.name));
        cc.title = '手动合集 · 点击在列表中查看';
        cc.onclick = () => openListColl(c);
        if (editorMode) {
          const x = el('i', 'chipx', '✕');
          x.title = '从「' + c.name + '」移出本书';
          x.onclick = (ev) => {
            ev.stopPropagation();
            c.books = c.books.filter(b => bookKey(b) !== bookKey(n.ref.title));
            save();
            toast('已从「' + c.name + '」移出');
            renderList();
            openDetail(n); // 重画面板刷新 chips
          };
          cc.appendChild(x);
        }
        chips.appendChild(cc);
      }
      if (has || editorMode) body.appendChild(el('div', 'note-label', '合集'));
      if (has) body.appendChild(chips);
      if (editorMode) {
        const row = el('div', 'colladd');
        const inp = document.createElement('input');
        inp.type = 'text'; inp.setAttribute('list', 'dlColls');
        inp.placeholder = '加入合集(新名称即创建)…'; inp.autocomplete = 'off';
        const btn = el('button', 'btn', '加入');
        btn.onclick = () => {
          const name = inp.value.trim();
          if (!name) { inp.focus(); return; }
          let c = findColl(name);
          if (c && collHasBook(c, n.ref.title)) { toast('本书已在「' + c.name + '」中'); return; }
          if (!c) {
            // 与作者合集重名:不另建手动合集;本书本就随作者字段归入其中
            const dupAuto = authorCollections().find(a => a.name.toLowerCase() === name.toLowerCase());
            if (dupAuto) { inp.value = ''; toast('「' + dupAuto.name + '」是已有合集,本书已在其列,未新建'); return; }
            c = { id: uid(), name, books: [] };
            state.collections.push(c);
          }
          collAddBook(c, n.ref.title);
          save();
          toast('已加入「' + c.name + '」');
          renderList();
          openDetail(n); // 重画面板刷新 chips
        };
        inp.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); btn.onclick(); } });
        row.append(inp, btn);
        body.appendChild(row);
      }
    }
    const acts = el('div', 'panel-actions');
    const bLoc = el('button', 'btn', '在图中定位');
    bLoc.onclick = () => centerOn(n);
    if (isBook && editorMode) {
      const bEdit = el('button', 'btn', '为本书添加摘录');
      bEdit.onclick = () => openEdit(null, n.ref.title, n.ref.author || '');
      acts.appendChild(bEdit);
      if (!G.bookView || bookKey(G.bookView) !== bookKey(n.ref.title)) {
        const bEnter = el('button', 'btn', '进入本书星图');
        bEnter.onclick = () => enterBookView(n.ref.title);
        acts.appendChild(bEnter);
      }
    }
    acts.appendChild(bLoc);
    acts.style.marginBottom = '14px'; // 按钮行在摘录清单上方,与清单留出间距
    body.appendChild(acts);
    const sorted = [...n.ref.items].sort((a, b) => a.createdAt.localeCompare(b.createdAt)); // 按时间正序:最早在前
    for (const e of sorted) {
      const it = el('div', 'exlist-item');
      it.appendChild(el('div', 'q', e.text));
      it.appendChild(el('div', 'm', fmtDate(e.createdAt) + (e.tags.length ? ' · ' + e.tags.join(' / ') : '')));
      it.onclick = () => { const en = G.nodeById.get('e:' + e.id); if (en) selectNode(en); };
      body.appendChild(it);
    }
  }
  $('detailPanel').classList.add('open');
}
function closeDetail() { $('detailPanel').classList.remove('open'); }

/* ---------- 列表面板:综合目录(顶层「合集|书籍」页签;子目录有返回行;作者合集与手动合集同级并列) ---------- */
let listCollFilter = null; // 合集目录:非空=正在看某合集(手动对象或 {auto:true,name:作者});null=非合集目录
let listTab = 'books';     // 顶层页签:'books' | 'colls'
const listExpanded = new Set(); // 书籍栏已展开的 bookKey:默认全折叠,折叠钮切换;搜索时强制全展
function renderList() {
  if (G.bookView) { listTab = 'books'; listCollFilter = null; } // 书籍目录优先
  const body = $('listBody');
  const q = ($('listFilter').value || '').trim().toLowerCase();
  body.textContent = '';
  $('listHead').textContent = G.bookView ? '《' + G.bookView + '》· 摘录' : (listCollFilter ? '「' + truncate(listCollFilter.name, 10) + '」· 摘录' : '全部摘录');
  const { books } = derive(G.bookView ? state.excerpts.filter(e => bookKey(e.book) === bookKey(G.bookView)) : null);
  const all = [...books.values()];
  /* 合集 = 手动合集 + 作者合集,同级并列不区分 */
  const authorColls = [...new Set(all.map(b => (b.author || '').trim()).filter(Boolean))].sort((a, z) => a.localeCompare(z));
  const nColls = state.collections.length + authorColls.length;
  let blist = all;
  if (listCollFilter && !listCollFilter.auto && !state.collections.some(c => c.id === listCollFilter.id)) listCollFilter = null; // 热更新替换/外部改动后兜底
  if (listCollFilter) {
    if (listCollFilter.auto) blist = all.filter(b => (b.author || '').toLowerCase() === listCollFilter.name.toLowerCase());
    else { const ks = new Set(listCollFilter.books.map(bookKey)); blist = all.filter(b => ks.has(bookKey(b.title))); }
  }
  /* 顶层页签:合集 | 书籍(点页签 = 回到该目录根) */
  const tabs = el('div', 'ltabs');
  const tC = el('span', 'ltab' + (listTab === 'colls' ? ' on' : ''));
  tC.append(document.createTextNode('合集'), el('span', 'ltabc', String(nColls)));
  tC.title = '合集目录';
  tC.onclick = () => { listTab = 'colls'; listCollFilter = null; if (G.collView) exitCollView(); else renderList(); };
  const tB = el('span', 'ltab' + (listTab !== 'colls' ? ' on' : ''));
  tB.append(document.createTextNode('书籍'), el('span', 'ltabc', String(all.length)));
  tB.title = '书籍目录';
  tB.onclick = () => { listTab = 'books'; if (G.bookView) exitBookView(); else if (G.collView) exitCollView(); else renderList(); };
  tabs.append(tC, tB);
  if (editorMode && listTab === 'colls') {
    const mg = el('span', 'sec-act', '管理');
    mg.title = '打开合集管理(新建/重命名/解散)';
    mg.onclick = openCollManager;
    tabs.appendChild(mg);
  }
  body.appendChild(tabs);
  /* 子目录返回行 */
  if (listCollFilter) {
    const cr = el('div', 'crumbrow');
    const back = el('span', 'backbtn', '‹ 全部合集');
    back.title = '返回合集目录(并退出合集星图)';
    back.onclick = () => { listCollFilter = null; if (G.collView) exitCollView(); else renderList(); };
    cr.appendChild(back);
    body.appendChild(cr);
  }
  if (listTab === 'colls') {
    if (listCollFilter) {
      appendBookGroups(body, blist, q, false); // 合集目录:该合集的书,折叠语义同书籍栏
    } else if (nColls === 0) {
      body.appendChild(el('p', 'coll-hint', editorMode ? '暂无合集:点「管理」新建,或在书籍详情面板把书加入合集' : '暂无合集'));
    } else {
      for (const c of state.collections) {
        const nIn = all.filter(b => c.books.some(bb => bookKey(bb) === bookKey(b.title))).length; // 现存书籍数(悬空成员不计)
        const row = el('div', 'coll-item');
        row.append(el('i', 'hex'), el('span', 'nm', c.name), el('span', 'cnt', nIn + ' 本'), el('span', 'go', '›'));
        row.title = '进入合集「' + c.name + '」(星图与目录)';
        row.onclick = () => { listCollFilter = c; enterCollView(c); renderList(); };
        body.appendChild(row);
      }
      for (const a of authorColls) {
        const nIn = all.filter(b => (b.author || '').trim() === a).length;
        const row = el('div', 'coll-item');
        row.append(el('i', 'hex'), el('span', 'nm', a), el('span', 'cnt', nIn + ' 本'), el('span', 'go', '›'));
        row.title = '进入作者合集「' + a + '」(星图与目录)';
        row.onclick = () => { listCollFilter = { auto: true, name: a }; enterCollView({ auto: true, name: a }); renderList(); };
        body.appendChild(row);
      }
    }
  } else if (G.bookView) {
    /* 书籍目录:专有界面(全展,无折叠钮,书名只是标识) */
    const cr = el('div', 'crumbrow');
    const back = el('span', 'backbtn', '‹ 主目录');
    back.title = '返回列表主目录';
    back.onclick = () => exitBookView();
    cr.appendChild(back);
    body.appendChild(cr);
    appendBookGroups(body, blist, q, true);
  } else {
    appendBookGroups(body, blist, q, false);
  }
}
function appendBookGroups(container, blist, q, forceOpen) {
  const entries = blist
    .map(b => ({ b, items: b.items.filter(e => !q || e.text.toLowerCase().includes(q) || b.title.toLowerCase().includes(q) || (b.author || '').toLowerCase().includes(q) || e.tags.some(t => t.toLowerCase().includes(q))) }))
    .filter(x => x.items.length)
    .sort((a, z) => Math.max(...z.items.map(i => i.createdAt)) - Math.max(...a.items.map(i => i.createdAt)));
  if (!entries.length) {
    container.appendChild(el('p', null, q ? '没有匹配的摘录' : (listCollFilter ? '该合集中暂无摘录' : (editorMode ? '还没有摘录,点右上角「添加摘录」开始' : '暂无已发布的摘录')))).style.cssText = 'color:var(--text-muted);font-size:13px;padding:14px 2px;';
    return;
  }
  for (const { b, items } of entries) {
    const bk = bookKey(b.title);
    const open = forceOpen || (!!q || listExpanded.has(bk)); // 书籍目录/搜索匹配时强制全展,主目录默认折叠
    const gh = el('div', 'group-head' + (open ? '' : ' folded'));
    const gt = el('span', 'chip bookchip');
    const gtDot = el('i'); gtDot.style.background = 'var(--book)';
    gt.append(gtDot, document.createTextNode('《' + b.title + '》'));
    if (!forceOpen) { // 书籍目录里书名只是标识,不再作为入口
      gt.title = '进入《' + b.title + '》星图面(列表保持打开)';
      gt.onclick = (ev) => { ev.stopPropagation(); enterBookView(b.title); };
      gt.addEventListener('mouseenter', (ev) => showTooltip({ type: 'book', ref: b }, ev.clientX, ev.clientY));
      gt.addEventListener('mouseleave', hideTooltip);
      const fb = el('span', 'foldbtn'); fb.appendChild(el('b', null, '▾'));
      fb.title = open ? '收起本书摘录' : '展开本书摘录';
      fb.onclick = (ev) => { ev.stopPropagation(); if (listExpanded.has(bk)) listExpanded.delete(bk); else listExpanded.add(bk); renderList(); };
      gh.appendChild(fb);
    }
    gh.append(gt, el('span', 'a', b.author || ''), el('span', 'n', items.length + ' 条'));
    container.appendChild(gh);
    if (!open) continue;
    const sorted = [...items].sort((a, z) => a.createdAt.localeCompare(z.createdAt)); // 按时间正序:最早在前
    for (const e of sorted) {
      const it = el('div', 'exlist-item');
      it.appendChild(el('div', 'q', e.text));
      it.appendChild(el('div', 'm', fmtDate(e.createdAt) + (e.tags.length ? ' · ' + e.tags.join(' / ') : '')));
      it.onclick = () => {
        if (W < 900) closeList(); // 窄屏侧栏近全宽,收下列表让位给详情;宽屏两栏并存
        const en = G.nodeById.get('e:' + e.id);
        if (en) { selectNode(en); centerOn(en); }
      };
      container.appendChild(it);
    }
  }
}
function openListColl(f) { listCollFilter = f; listTab = 'colls'; openList(); }
function openList() { renderList(); $('listPanel').classList.add('open'); }
function closeList() { $('listPanel').classList.remove('open'); }

/* ---------- 统计 / 图例 / datalist ---------- */
function updateStats() {
  const src = G.bookView ? state.excerpts.filter(e => bookKey(e.book) === bookKey(G.bookView))
    : (G.collView ? (() => { const ks = collMembers(G.collView); return state.excerpts.filter(e => ks.has(bookKey(e.book))); })() : state.excerpts);
  const { books, tags } = derive(src);
  const nE = src.length;
  $('stats').textContent = '';
  const s = $('stats');
  let parts;
  if (G.bookView) {
    s.appendChild(el('b', null, '《' + G.bookView + '》'));
    s.appendChild(document.createTextNode(' · '));
    parts = [[nE, '条摘录'], [tags.size, '个主题']];
  } else if (G.collView) {
    s.appendChild(el('b', null, '「' + G.collView.name + '」'));
    s.appendChild(document.createTextNode(' · '));
    parts = [[books.size, '本书'], [nE, '条摘录'], [tags.size, '个主题']];
  } else {
    parts = [[books.size, '本书'], [nE, '条摘录'], [tags.size, '个主题']];
  }
  parts.forEach(([n, unit], i) => {
    if (i) s.appendChild(document.createTextNode(' · '));
    const b = el('b', null, String(n));
    s.append(b, document.createTextNode(' ' + unit));
  });
  $('cntBook').textContent = String(G.bookView ? 1 : books.size);
  $('cntTag').textContent = String(tags.size);
  $('cntEx').textContent = String(nE);
  document.body.dataset.empty = state.excerpts.length === 0 ? 'true' : 'false';
  $('emptyState').classList.toggle('show', state.excerpts.length === 0);
}
function refreshDatalists() {
  const { books, tags } = derive();
  const fill = (id, arr) => {
    const dl = $(id); dl.textContent = '';
    for (const v of arr) { const o = document.createElement('option'); o.value = v; dl.appendChild(o); }
  };
  fill('dlBooks', [...books.values()].map(b => b.title).sort());
  fill('dlAuthors', [...new Set([...books.values()].map(b => b.author).filter(Boolean))].sort());
  fill('dlTags', [...tags.values()].map(t => t.name).sort());
  fill('dlColls', state.collections.map(c => c.name).sort());
}

/* ---------- 添加 / 编辑 ---------- */
let editingId = null;
let editDraft = null; // 意外关闭(点窗口外空白)时暂存的未完成添加,下次「添加摘抄」接续
function openEdit(e, presetBook, presetAuthor) {
  if (!editorMode) return; // 只读镜像:无编辑
  editingId = e ? e.id : null;
  $('editTitle').textContent = e ? '编辑摘录' : '添加摘录';
  const d = (!e && editDraft) ? editDraft : null; // 接续上次未完成的添加
  $('inText').value = e ? e.text : (d ? d.text : '');
  $('inBook').value = e ? e.book : (d ? d.book : (presetBook || ''));
  $('inAuthor').value = e ? e.author : (d ? d.author : (presetAuthor || ''));
  $('inTags').value = e ? e.tags.join(', ') : (d ? d.tags : '');
  $('inNote').value = e ? e.note : (d ? d.note : '');
  $('fText').classList.remove('invalid');
  $('fBook').classList.remove('invalid');
  refreshDatalists();
  $('editOverlay').classList.add('open');
  if (d) toast('已接续上次未完成的编辑');
  setTimeout(() => $('inText').focus(), 60);
}
function closeEdit(discard) {
  // 点窗口外空白关闭且在「添加」态 = 意外关闭,暂存已输入内容待接续;
  // 取消/Esc/保存成功 = 有意关闭,清暂存;编辑已有条目不暂存(原值仍在库里)。
  if (discard) editDraft = null;
  else if (!editingId) {
    const d = { text: $('inText').value, book: $('inBook').value, author: $('inAuthor').value,
                tags: $('inTags').value, note: $('inNote').value };
    if ((d.text + d.book + d.author + d.tags + d.note).trim()) editDraft = d;
  }
  $('editOverlay').classList.remove('open');
  editingId = null;
}
function parseTags(s) {
  const seen = new Set(), out = [];
  for (const t of s.split(/[,，、;；]+/).map(x => x.trim()).filter(Boolean)) {
    const k = t.toLowerCase();
    if (!seen.has(k)) { seen.add(k); out.push(t); }
  }
  return out.slice(0, 12);
}
function saveEdit() {
  const text = $('inText').value.trim();
  const book = normBook($('inBook').value);
  let ok = true;
  $('fText').classList.toggle('invalid', !text); if (!text) ok = false;
  $('fBook').classList.toggle('invalid', !book); if (!book) ok = false;
  if (!ok) return;
  const data = {
    text, book,
    author: $('inAuthor').value.trim(),
    tags: parseTags($('inTags').value),
    note: $('inNote').value.trim(),
  };
  if (editingId) {
    const e = state.excerpts.find(x => x.id === editingId);
    if (e) Object.assign(e, data);
    toast('已保存修改');
  } else {
    state.excerpts.push({ id: uid(), createdAt: new Date().toISOString(), ...data });
    toast('已添加摘录');
  }
  save();
  closeEdit(true); // 已入库,暂存一并清掉
  rebuild(false);
  $('emptyState').classList.remove('show');
}

/* ---------- 删除 / 清空(确认框) ---------- */
let confirmCb = null;
function showConfirm(title, body, okText, cb) {
  $('confirmTitle').textContent = title;
  $('confirmBody').textContent = body;
  $('confirmOk').textContent = okText;
  confirmCb = cb;
  $('confirmOverlay').classList.add('open');
}
function closeConfirm() { $('confirmOverlay').classList.remove('open'); confirmCb = null; }
$('confirmOk').addEventListener('click', () => { const cb = confirmCb; closeConfirm(); if (cb) cb(); });
$('confirmCancel').addEventListener('click', closeConfirm);
$('confirmOverlay').addEventListener('pointerdown', (e) => { if (e.target === $('confirmOverlay')) closeConfirm(); });

function confirmDelete(e) {
  if (!editorMode) return; // 只读镜像:无删除
  showConfirm('删除这条摘录?', truncate(e.text, 40), '删除', () => {
    state.excerpts = state.excerpts.filter(x => x.id !== e.id);
    save();
    G.selectedId = null;
    closeDetail();
    rebuild(false);
    toast('已删除');
  });
}

/* ---------- 导入 / 导出 ---------- */
function exportJson() {
  const blob = new Blob([JSON.stringify({ v: 1, exportedAt: new Date().toISOString(), excerpts: state.excerpts, collections: state.collections }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '摘录星图备份_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('已导出 ' + state.excerpts.length + ' 条摘录' + (state.collections.length ? ' · ' + state.collections.length + ' 个合集' : ''));
}
$('fileInput').addEventListener('change', (ev) => {
  const f = ev.target.files[0];
  ev.target.value = '';
  if (!f) return;
  if (!editorMode) { toast('只读镜像:不支持导入'); return; }
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const d = JSON.parse(reader.result);
      const arr = Array.isArray(d) ? d : d.excerpts;
      if (!Array.isArray(arr)) throw new Error('bad');
      let added = 0, skipped = 0, cAdded = 0;
      const ids = new Set(state.excerpts.map(x => x.id));
      for (const raw of arr) {
        const e = normalizeExcerpt(raw);
        if (!e || !e.book) { skipped++; continue; }
        if (ids.has(e.id)) { skipped++; continue; }
        ids.add(e.id);
        state.excerpts.push(e);
        added++;
      }
      if (Array.isArray(d.collections)) { // 合并合集:按 id 去重
        const cids = new Set(state.collections.map(c => c.id));
        for (const raw of d.collections) {
          const c = normalizeCollection(raw);
          if (!c || cids.has(c.id)) continue;
          cids.add(c.id);
          state.collections.push(c);
          cAdded++;
        }
      }
      save();
      rebuild(false);
      toast('导入完成:新增 ' + added + ' 条' + (cAdded ? ' · ' + cAdded + ' 个合集' : '') + (skipped ? ',跳过 ' + skipped + ' 条' : ''));
    } catch {
      toast('导入失败:文件格式不正确');
    }
  };
  reader.readAsText(f, 'utf-8');
});

/* ---------- 合集管理 ---------- */
let collRenamingId = null; // 正在内联改名的手动合集 id
function openCollManager() {
  collRenamingId = null;
  $('collNewName').value = '';
  renderCollRows();
  $('collOverlay').classList.add('open');
  $('collNewName').focus();
}
function closeCollManager() { $('collOverlay').classList.remove('open'); }
function syncOpenBookDetail() { // 管理弹窗改动后,若详情面板正开着某本书,同步刷新其合集 chips
  const sn = G.nodeById.get(G.selectedId);
  if (sn && sn.type === 'book') openDetail(sn);
}
function renderCollRows() {
  const box = $('collRows');
  box.textContent = '';
  if (!state.collections.length) {
    box.appendChild(el('p', null, '还没有手动合集。在书籍详情里把书加入合集,或在上方新建。')).style.cssText = 'color:var(--text-muted);font-size:12.5px;padding:10px 2px;';
  }
  for (const c of state.collections) {
    const row = el('div', 'coll-crow');
    if (collRenamingId === c.id) {
      const inp = document.createElement('input');
      inp.type = 'text'; inp.value = c.name; inp.autocomplete = 'off';
      const commit = () => {
        const name = inp.value.trim();
        if (!name) { inp.focus(); return; }
        const dup = findColl(name);
        if (dup && dup.id !== c.id) { toast('已有同名合集'); inp.focus(); return; }
        c.name = name;
        collRenamingId = null;
        save(); refreshDatalists(); renderList(); syncOpenBookDetail();
        renderCollRows();
        toast('已重命名为「' + name + '」');
      };
      inp.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter') { ev.preventDefault(); commit(); }
        else if (ev.key === 'Escape') { ev.stopPropagation(); collRenamingId = null; renderCollRows(); }
      });
      const bOk = el('button', 'btn', '✓');
      bOk.onclick = commit;
      const bNo = el('button', 'btn', '✕');
      bNo.onclick = () => { collRenamingId = null; renderCollRows(); };
      row.append(inp, bOk, bNo);
    } else {
      row.append(el('span', 'nm', c.name), el('span', 'cnt', c.books.length + ' 本书'));
      const bRe = el('button', 'btn', '重命名');
      bRe.onclick = () => { collRenamingId = c.id; renderCollRows(); };
      const bDis = el('button', 'btn', '解散');
      bDis.onclick = () => showConfirm('解散合集?', '「' + c.name + '」将被删除,书籍与摘录本身不受影响。', '解散', () => {
        state.collections = state.collections.filter(x => x.id !== c.id);
        if (listCollFilter && listCollFilter.id === c.id) listCollFilter = null;
        save(); refreshDatalists(); renderList(); syncOpenBookDetail();
        renderCollRows();
        toast('已解散「' + c.name + '」');
      });
      row.append(bRe, bDis);
    }
    box.appendChild(row);
  }
  const autos = authorCollections();
  if (autos.length) {
    const lbl = el('div', 'note-label', '作者合集(自动生成,随摘录的作者字段变化)');
    box.appendChild(lbl);
    for (const a of autos) {
      const row = el('div', 'coll-crow auto');
      row.append(el('span', 'nm', a.name), el('span', 'cnt', a.books.length + ' 本书'));
      box.appendChild(row);
    }
  }
}
function createCollection() {
  const name = $('collNewName').value.trim();
  if (!name) { $('collNewName').focus(); return; }
  // 手动合集与作者合集共用一个命名空间:任一重名都不另建
  if (findColl(name) || authorCollections().some(a => a.name.toLowerCase() === name.toLowerCase())) { toast('已有同名合集,未另建'); return; }
  state.collections.push({ id: uid(), name, books: [] });
  $('collNewName').value = '';
  save(); refreshDatalists(); renderList();
  renderCollRows();
  toast('已创建合集「' + name + '」');
}
$('collNewBtn').addEventListener('click', createCollection);
$('collNewName').addEventListener('keydown', (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); createCollection(); } });
$('collClose').addEventListener('click', closeCollManager);
$('collOverlay').addEventListener('pointerdown', (e) => { if (e.target === $('collOverlay')) closeCollManager(); });
$('miColls').addEventListener('click', () => {
  if (!editorMode) { toggleMenu(false); return; } // 菜单本身只读模式不渲染,守卫仅为稳妥
  toggleMenu(false);
  openCollManager();
});

/* ---------- Toast ---------- */
let toastTimer = null;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

/* ---------- 搜索 ---------- */
let searchIdx = 0;
$('search').addEventListener('input', (e) => {
  G.searchQuery = e.target.value;
  searchIdx = 0;
  computeFocus();
  $('searchCount').textContent = G.searchQuery.trim() ? (G.searchHits.length ? G.searchHits.length + ' 个结果' : '无结果') : '';
  ensureLoop();
});
$('search').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && G.searchHits.length) {
    const n = G.searchHits[searchIdx % G.searchHits.length];
    searchIdx++;
    selectNode(n);
    centerOn(n);
  } else if (e.key === 'Escape') {
    e.stopPropagation();
    e.target.value = ''; G.searchQuery = ''; searchIdx = 0;
    computeFocus();
    $('searchCount').textContent = '';
    render(); e.target.blur();
  }
});

/* ---------- 更多菜单 ---------- */
const moreMenu = $('moreMenu');
function toggleMenu(force) {
  const open = force !== undefined ? force : !moreMenu.classList.contains('open');
  moreMenu.classList.toggle('open', open);
  if (open) {
    const r = $('btnMore').getBoundingClientRect();
    moreMenu.style.top = (r.bottom + 8) + 'px';
    moreMenu.style.right = Math.max(10, W - r.right) + 'px';
    moreMenu.style.left = 'auto';
  }
}
$('btnMore').addEventListener('click', (e) => { e.stopPropagation(); toggleMenu(); });
document.addEventListener('pointerdown', (e) => {
  if (moreMenu.classList.contains('open') && !moreMenu.contains(e.target) && e.target !== $('btnMore')) toggleMenu(false);
});
$('miExport').addEventListener('click', () => { toggleMenu(false); exportJson(); });
$('miImport').addEventListener('click', () => { toggleMenu(false); $('fileInput').click(); });
$('unpinAll').addEventListener('click', () => { if (!splitMode) releaseAllPins(); });
$('miUnpin').addEventListener('click', () => { toggleMenu(false); releaseAllPins(); });
$('miClear').addEventListener('click', () => {
  if (!editorMode) { toggleMenu(false); return; }
  toggleMenu(false);
  showConfirm('清空所有数据?', '将删除全部 ' + state.excerpts.length + ' 条摘录' + (state.collections.length ? '与 ' + state.collections.length + ' 个合集' : '') + ',此操作不可撤销(建议先导出备份)。', '清空', () => {
    state.excerpts = [];
    state.collections = [];
    listCollFilter = null;
    save();
    G.selectedId = null;
    closeDetail();
    rebuild(true);
    toast('已清空');
  });
});

/* ---------- 其余 UI 接线 ---------- */
$('btnAdd').addEventListener('click', () => {
  if (!G.bookView) { openEdit(); return; }
  const b = derive().books.get(bookKey(G.bookView));
  openEdit(null, G.bookView, (b && b.author) || '');
});
$('btnList').addEventListener('click', () => $('listPanel').classList.contains('open') ? closeList() : openList());
$('bookBack').addEventListener('click', () => { if (G.bookView) exitBookView(); else exitCollView(); });
$('tabNew').addEventListener('click', newTab);
$('tabSplit').addEventListener('click', () => toggleSplit());
$('listClose').addEventListener('click', closeList);
$('detailClose').addEventListener('click', () => { G.selectedId = null; closeDetail(); computeFocus(); render(); });
$('listFilter').addEventListener('input', renderList);
$('editCancel').addEventListener('click', () => closeEdit(true));
$('editSave').addEventListener('click', saveEdit);
$('editOverlay').addEventListener('pointerdown', (e) => { if (e.target === $('editOverlay')) closeEdit(); });
$('inBook').addEventListener('change', () => {
  // 选已有书名时自动补作者
  const { books } = derive();
  const b = books.get(bookKey(normBook($('inBook').value)));
  if (b && b.author && !$('inAuthor').value) $('inAuthor').value = b.author;
});
$('zoomIn').addEventListener('click', () => { if (!splitMode) zoomAt(1.28, W / 2, H / 2); });
$('zoomOut').addEventListener('click', () => { if (!splitMode) zoomAt(1 / 1.28, W / 2, H / 2); });
$('zoomFit').addEventListener('click', () => { if (!splitMode) fitView(); });
$('emptyAdd').addEventListener('click', () => openEdit());
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (splitMode) { toggleSplit(false); return; }
    if ($('editOverlay').classList.contains('open')) closeEdit(true);
    else if ($('confirmOverlay').classList.contains('open')) closeConfirm();
    else if ($('collOverlay').classList.contains('open')) closeCollManager();
    else if (moreMenu.classList.contains('open')) toggleMenu(false);
    else if ($('detailPanel').classList.contains('open')) { G.selectedId = null; closeDetail(); computeFocus(); render(); }
    else if ($('listPanel').classList.contains('open')) closeList();
    else if (G.bookView) exitBookView();
    else if (G.collView) exitCollView();
  }
  if (e.key === '/' && document.activeElement && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
    e.preventDefault();
    $('search').focus();
  }
});
window.addEventListener('resize', resize);

/* ---------- 启动 ---------- */
/* 日夜间模式事件面:storage(父页 toggle 写入,iframe 收到跨文档事件) + 父页 html 属性观察(file:// 跨源则无父页可看) */
window.addEventListener('storage', (e) => {
  if (e && e.key !== null && e.key !== 'suki.theme') return;
  try { applyTheme(localStorage.getItem('suki.theme') === 'light' ? 'light' : 'dark'); } catch (err) { /* 忽略 */ }
});
try {
  if (window.parent && window.parent !== window) {
    const pe = window.parent.document.documentElement;
    new MutationObserver(() => {
      try { applyTheme(pe.dataset.theme === 'light' ? 'light' : 'dark'); } catch (err) { /* 忽略 */ }
    }).observe(pe, { attributes: true, attributeFilter: ['data-theme'] });
  }
} catch (e) { /* 跨源(本地 file://)无父页可看,忽略 */ }
/* 测试辅助: ?ui=list|detail|add|menu 打开对应界面; ?book=书名 直进该书星图面; ?coll=合集名 直进该合集星图; ?notrans=1 禁用过渡(截图用) */
const qs = new URLSearchParams(location.search);
if (qs.get('notrans') === '1') {
  const st = document.createElement('style');
  st.textContent = '*{transition:none !important;animation:none !important;}';
  document.head.appendChild(st);
}
(async () => {
  await bootStore(); // 探测本地服务:可达=editor(写 excerpts.json);不可达=viewer(读发布数据)
  if (!editorMode) document.body.dataset.readonly = 'true';
  resize();
  refreshCanvasPalette(); // 首帧前把画布色板对齐当前主题(head 内联脚本可能已标 light)
  rebuild(true);
  /* 标签页:首屏即第 1 页 */
  {
    const first = createTab(null);
    activeTabId = first.id;
    first.snap = snapGraph();
    renderTabbar();
  }
  /* 测试钩子:?tabs=书A,书B 预开多页;?split=1 直接同屏;?newtab=1 同屏下再开一页(回归卡死) */
  const tbk = qs.get('tabs');
  if (tbk && state.excerpts.length) for (const name of tbk.split(',').filter(Boolean).slice(0, 3)) buildTab(createTab(name));
  if (qs.get('split') === '1' && tabs.length > 1) toggleSplit(true);
  if (qs.get('newtab') === '1') newTab();
  if (state.excerpts.length) {
    const ui = qs.get('ui');
    if (ui === 'list') openList();
    else if (ui === 'detail') { const n = G.nodes.find(x => x.type === 'excerpt'); if (n) { selectNode(n); centerOn(n); } }
    else if (ui === 'add') openEdit();
    else if (ui === 'menu') toggleMenu(true);
    const bk = qs.get('book');
    if (bk) enterBookView(bk);
    const ck = qs.get('coll'); // ?coll=合集名 直进该合集星图(手动合集按名匹配,否则按作者名视为作者合集)
    if (ck && !bk) {
      const c = state.collections.find(x => x.name === ck) || { auto: true, name: ck };
      if (collMembers(c).size) enterCollView(c);
    }
  }
})();
</script>
