<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>摘录星图 · 书籍摘录关系云图</title>
<script>/* 日夜间模式:与 suki 站点同款防闪变回放(深色为默认,选过日间则先标记) */
try{if(localStorage.getItem("suki.theme")==="light")document.documentElement.dataset.theme="light"}catch(e){}</script>
<style>
  /* ===== 设计令牌(dataviz 参考调色板 · 深浅双模式,已验证;深色默认)===== */
  :root {
    color-scheme: dark;
    --page:           #0d0d0d;   /* 页面底色(星空) */
    --surface-1:      #1a1a19;   /* 面板表面 */
    --surface-2:      #232322;   /* 悬停/输入底 */
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --hairline:       #2c2c2a;
    --border:         rgba(255,255,255,0.10);
    --book:           #3987e5;   /* 槽位1 蓝 · 书籍 */
    --tag:            #d95926;   /* 槽位2 橙 · 主题 */
    --excerpt:        #199e70;   /* 槽位3 青 · 摘录 */
    --accent:         #3987e5;
    --critical:       #d03b3b;
    --danger:         #e66767;   /* 危险文字(暗色槽位8红) */
    --danger-strong:  #f08c8c;   /* 危险悬停文字 */
    --glass:          rgba(26,26,25,0.86);  /* 悬浮件玻璃底(顶栏/图例/缩放) */
    --glass-solid:    rgba(26,26,25,0.96);  /* 气泡等更实底 */
    --scrim:          rgba(13,13,13,0.62);  /* 弹窗遮罩 */
    --wash:           rgba(255,255,255,0.14); /* 深底上的浅色洗选 */
    --wash-line:      rgba(255,255,255,0.65); /* 选中 chip 边 */
    --hoverline:      rgba(255,255,255,0.22); /* 列表项悬停边 */
    --logo-line:      rgba(255,255,255,0.35); /* 徽标连线 */
    /* 画布专用(浅色下白线不可见,须随主题翻转;由 JS 读入 C) */
    --edge:           #ffffff;   /* 连线 */
    --ring:           #ffffff;   /* 悬停/选中外环 */
    --divider:        rgba(255,255,255,0.09); /* 同屏分隔线 */
    --text2-dim:      rgba(195,194,183,0.72); /* 同屏页名次级文字 */
    --labelchip-bg:   rgba(13,13,13,0.82);   /* 同屏页名底 */
    --shadow:         0 10px 32px rgba(0,0,0,0.45);
    --font: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  /* 日间模式只覆盖颜色变量(suki 同款 data-theme 约定;节点色=参考调色板浅色槽位1-3) */
  :root[data-theme="light"] {
    color-scheme: light;
    --page:           #f9f9f7;
    --surface-1:      #fcfcfb;
    --surface-2:      #ececea;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --hairline:       #e1e0d9;
    --border:         rgba(11,11,11,0.12);
    --book:           #2a78d6;
    --tag:            #eb6834;
    --excerpt:        #1baf7a;
    --accent:         #2a78d6;
    --danger:         #e34948;
    --danger-strong:  #c23434;
    --glass:          rgba(252,252,251,0.88);
    --glass-solid:    rgba(252,252,251,0.97);
    --scrim:          rgba(11,11,11,0.32);
    --wash:           rgba(11,11,11,0.08);
    --wash-line:      rgba(11,11,11,0.5);
    --hoverline:      rgba(11,11,11,0.25);
    --logo-line:      rgba(11,11,11,0.35);
    --edge:           #0b0b0b;
    --ring:           #0b0b0b;
    --divider:        rgba(11,11,11,0.12);
    --text2-dim:      rgba(82,81,78,0.75);
    --labelchip-bg:   rgba(255,255,255,0.92);
    --shadow:         0 10px 32px rgba(11,11,11,0.16);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: var(--font);
    background: var(--page);
    color: var(--text-primary);
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; }
  input, textarea { font-family: inherit; }

  #graph { position: fixed; inset: 0; display: block; touch-action: none; cursor: default; }
  #graph.grabbable { cursor: grab; }
  #graph.grabbing  { cursor: grabbing; }
  #graph.pointing  { cursor: pointer; }

  /* ===== 顶栏 ===== */
  .topbar {
    position: fixed; top: 14px; left: 14px; right: 14px; z-index: 20;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 9px 14px;
    background: var(--glass);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border); border-radius: 14px;
    box-shadow: var(--shadow);
  }
  .brand { display: flex; align-items: center; gap: 9px; margin-right: 4px; }
  .brand .logo {
    width: 26px; height: 26px; border-radius: 8px; flex: none;
    background: linear-gradient(135deg, rgba(57,135,229,0.25), rgba(25,158,112,0.18));
    border: 1px solid var(--border);
    display: grid; place-items: center;
  }
  /* 徽标三节点随主题取色(CSS 覆盖 SVG 表现属性) */
  .brand .logo circle:nth-of-type(1) { fill: var(--book); }
  .brand .logo circle:nth-of-type(2) { fill: var(--tag); }
  .brand .logo circle:nth-of-type(3) { fill: var(--excerpt); }
  .brand .logo path { stroke: var(--logo-line); }
  .brand h1 { font-size: 15px; font-weight: 650; letter-spacing: 0.02em; white-space: nowrap; }
  .stats { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
  .stats b { color: var(--text-secondary); font-weight: 600; }
  .searchwrap { position: relative; flex: 1 1 200px; max-width: 380px; min-width: 150px; }
  .searchwrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); opacity: 0.55; pointer-events: none; }
  #search {
    width: 100%; padding: 8px 64px 8px 32px;
    background: var(--surface-2); color: var(--text-primary);
    border: 1px solid var(--hairline); border-radius: 10px;
    font-size: 13px; outline: none; transition: border-color .15s;
  }
  #search::placeholder { color: var(--text-muted); }
  #search:focus { border-color: rgba(57,135,229,0.65); }
  #searchCount {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    font-size: 11px; color: var(--text-muted); white-space: nowrap; pointer-events: none;
  }
  .spacer { flex: 1; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 500;
    background: transparent; color: var(--text-secondary);
    border: 1px solid var(--hairline);
    transition: background .15s, color .15s, border-color .15s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--surface-2); color: var(--text-primary); }
  .btn.primary { background: var(--accent); border-color: transparent; color: #fff; }
  .btn.primary:hover { background: #2a78d6; }
  .btn.danger { color: var(--danger); }
  .btn.danger:hover { background: rgba(208,59,59,0.14); border-color: rgba(208,59,59,0.4); color: var(--danger-strong); }
  .btn.icon { padding: 8px 10px; }
  .btn:focus-visible, .iconbtn:focus-visible { outline: 2px solid rgba(57,135,229,0.8); outline-offset: 2px; }

  /* ===== 星图页标签栏(顶栏第二行)===== */
  #tabbar { flex-basis: 100%; display: flex; align-items: center; gap: 6px; padding-top: 8px; border-top: 1px solid var(--hairline); margin-top: 3px; }
  #tabs { display: flex; gap: 6px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  #tabs::-webkit-scrollbar { display: none; }
  .tab {
    display: inline-flex; align-items: center; gap: 7px; flex: none;
    max-width: 200px; padding: 4px 7px 4px 11px;
    border: 1px solid var(--hairline); border-radius: 8px;
    font-size: 12px; color: var(--text-muted); background: transparent;
    cursor: pointer; transition: background .15s, color .15s, border-color .15s;
  }
  .tab .tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab .x { opacity: .5; font-size: 10.5px; padding: 1px 4px; border-radius: 4px; flex: none; }
  .tab .x:hover { opacity: 1; background: var(--wash); color: var(--text-primary); }
  .tab:hover { color: var(--text-secondary); background: var(--surface-2); }
  .tab.active { color: var(--text-primary); background: var(--surface-2); border-color: rgba(57,135,229,0.55); }
  .tab.active::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--book); flex: none; }
  .tabbtn { padding: 4px 9px; font-size: 12px; border-radius: 8px; flex: none; }
  .tabbtn.on { color: var(--book); border-color: var(--book); }
  .tabbtn:disabled { opacity: .35; cursor: default; }
  .tabbtn:disabled:hover { background: transparent; color: var(--text-secondary); }

  /* ===== 更多菜单 ===== */
  .menu {
    position: fixed; z-index: 45; min-width: 190px;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--shadow); padding: 6px; display: none;
  }
  .menu.open { display: block; }
  .menu button {
    display: flex; width: 100%; align-items: center; gap: 8px;
    padding: 9px 11px; border: 0; border-radius: 8px;
    background: transparent; color: var(--text-secondary); font-size: 13px; text-align: left;
  }
  .menu button:hover { background: var(--surface-2); color: var(--text-primary); }
  .menu button.danger { color: var(--danger); }
  .menu button.danger:hover { background: rgba(208,59,59,0.12); }
  .menu hr { border: 0; border-top: 1px solid var(--hairline); margin: 6px 4px; }

  /* ===== 图例 ===== */
  .legend {
    position: fixed; left: 14px; bottom: 14px; z-index: 20;
    background: var(--glass);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 14px; display: flex; flex-direction: column; gap: 8px;
    box-shadow: var(--shadow);
  }
  .legend .row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-secondary); }
  .legend .dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .legend .dot.circle { border-radius: 50%; }
  .legend .dot.diamond { border-radius: 2px; transform: rotate(45deg) scale(0.9); }
  .legend .cnt { color: var(--text-muted); margin-left: 2px; }
  .legend .hint { font-size: 11px; color: var(--text-muted); border-top: 1px solid var(--hairline); padding-top: 8px; max-width: 210px; line-height: 1.5; }

  /* ===== 缩放控件 ===== */
  .zoomctl {
    position: fixed; right: 14px; bottom: 14px; z-index: 20;
    display: flex; flex-direction: column; gap: 4px;
    background: var(--glass);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border); border-radius: 12px; padding: 5px;
    box-shadow: var(--shadow);
  }
  .iconbtn {
    width: 34px; height: 34px; border-radius: 9px; border: 0;
    background: transparent; color: var(--text-secondary);
    display: grid; place-items: center; font-size: 16px;
    transition: background .15s, color .15s;
  }
  .iconbtn:hover { background: var(--surface-2); color: var(--text-primary); }
  .iconbtn:disabled { opacity: 0.32; cursor: default; }
  .iconbtn:disabled:hover { background: transparent; color: var(--text-secondary); }
  .zoomctl .sep { height: 1px; background: var(--hairline); margin: 2px 4px; }

  /* ===== 提示气泡 ===== */
  #tooltip {
    position: fixed; z-index: 40; pointer-events: none; display: none;
    max-width: 300px;
    background: var(--glass-solid);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 11px; box-shadow: var(--shadow);
  }
  #tooltip .tt-title { font-size: 12.5px; font-weight: 600; color: var(--text-primary); display: flex; align-items: center; gap: 6px; line-height: 1.45; }
  #tooltip .tt-title .key { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  #tooltip .tt-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; }

  /* ===== 侧栏(详情 / 列表)===== */
  .panel {
    position: fixed; top: 0; bottom: 0; z-index: 30;
    width: min(400px, 100vw);
    background: var(--surface-1);
    border-color: var(--hairline);
    display: flex; flex-direction: column;
    transition: transform .28s cubic-bezier(.32,.72,.35,1);
    box-shadow: var(--shadow);
  }
  #detailPanel { right: 0; border-left: 1px solid var(--hairline); transform: translateX(105%); }
  #detailPanel.open { transform: translateX(0); }
  #listPanel { left: 0; border-right: 1px solid var(--hairline); transform: translateX(-105%); }
  #listPanel.open { transform: translateX(0); }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 18px 12px; flex: none;
  }
  .panel-head h2 { font-size: 14px; font-weight: 650; color: var(--text-secondary); letter-spacing: 0.04em; }
  .panel-body { flex: 1; overflow-y: auto; padding: 4px 18px 24px; }
  .panel-body::-webkit-scrollbar { width: 8px; }
  .panel-body::-webkit-scrollbar-thumb { background: var(--hairline); border-radius: 4px; }
  #bookBack[hidden] { display: none; }
  #bookBack { color: var(--book); border-color: var(--book); }

  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; color: var(--text-secondary);
    border: 1px solid var(--hairline); border-radius: 999px; padding: 3px 10px;
  }
  .badge i { width: 8px; height: 8px; border-radius: 50%; }

  .quote {
    font-size: 16px; line-height: 1.85; color: var(--text-primary);
    padding: 2px 0 2px 14px; margin: 16px 0;
    border-left: 2px solid var(--text-muted);
    white-space: pre-wrap; word-break: break-word;
  }
  .meta { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font-size: 13px; margin: 14px 0; }
  .meta dt { color: var(--text-muted); }
  .meta dd { color: var(--text-secondary); }
  .meta dd .link { color: var(--text-primary); cursor: pointer; border-bottom: 1px dashed var(--text-muted); }
  .meta dd .link:hover { border-bottom-color: var(--text-primary); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 4px; }
  .chip {
    font-size: 12px; color: var(--text-secondary); cursor: pointer;
    background: var(--surface-2); border: 1px solid var(--hairline);
    border-radius: 999px; padding: 4px 11px;
    display: inline-flex; align-items: center; gap: 6px;
    transition: border-color .15s, color .15s;
  }
  .chip:hover { border-color: rgba(217,89,38,0.6); color: var(--text-primary); }
  .chip i { width: 7px; height: 7px; border-radius: 2px; transform: rotate(45deg); background: var(--tag); }
  .chip.bookchip i { border-radius: 50%; transform: none; background: var(--book); }
  .chip.bookchip:hover { border-color: rgba(57,135,229,0.6); }
  .chip i.hex { width: 9px; height: 10px; border-radius: 0; transform: none; background: var(--text-secondary);
    clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); }
  .chip.collchip.auto { border-style: dashed; color: var(--text-muted); }
  .chip.collchip.auto i.hex { background: var(--text-muted); }
  .chip.collchip.on { border-color: var(--wash-line); color: var(--text-primary); }
  .chip .chipx { font-style: normal; margin-left: 1px; padding: 0 1px; color: var(--text-muted); }
  .chip .chipx:hover { color: var(--danger); }
  .ltabs { display: flex; align-items: center; gap: 6px; margin: 12px 0 4px; }
  .ltab {
    flex: 1; text-align: center; padding: 6px 0;
    border: 1px solid var(--hairline); border-radius: 8px;
    font-size: 12.5px; color: var(--text-muted); cursor: pointer; user-select: none; -webkit-user-select: none;
    transition: background .15s, color .15s, border-color .15s;
  }
  .ltab:hover { color: var(--text-secondary); background: var(--surface-2); }
  .ltab.on { color: var(--text-primary); background: var(--surface-2); border-color: rgba(57,135,229,0.55); }
  .ltabc { font-size: 11px; color: var(--text-muted); margin-left: 5px; }
  .ltabs .sec-act { flex: none; margin-left: auto; }
  .crumbrow { margin: 10px 0 2px; }
  .backbtn {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 10px; border: 1px solid var(--hairline); border-radius: 8px;
    font-size: 12px; color: var(--text-secondary); cursor: pointer;
    transition: background .15s, color .15s;
  }
  .backbtn:hover { background: var(--surface-2); color: var(--text-primary); }
  .sec-act {
    font-size: 11px; color: var(--text-muted); cursor: pointer;
    border: 1px solid var(--hairline); border-radius: 6px; padding: 1px 7px; letter-spacing: 0;
    transition: color .15s, border-color .15s;
  }
  .sec-act:hover { color: var(--text-primary); border-color: var(--hoverline); }
  .coll-hint { color: var(--text-muted); font-size: 12.5px; padding: 2px 2px 6px; }
  .coll-item {
    display: flex; align-items: center; gap: 9px; padding: 9px 12px;
    border: 1px solid var(--hairline); border-radius: 10px; margin-bottom: 6px;
    cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text-primary);
    transition: border-color .15s, background .15s, color .15s;
  }
  .coll-item:hover { border-color: var(--hoverline); background: var(--surface-2); }
  .coll-item.on { border-color: var(--wash-line); background: var(--surface-2); }
  .coll-item .hex { width: 9px; height: 10px; flex: none; background: var(--tag);
    clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); }
  .coll-item .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .coll-item .cnt { font-size: 11px; font-weight: 400; color: var(--text-muted); flex: none; }
  .coll-item .go { font-size: 13px; color: var(--text-muted); flex: none; transition: color .15s, transform .15s; }
  .coll-item:hover .go { color: var(--text-primary); transform: translateX(2px); }
  .colladd { display: flex; gap: 8px; margin: 8px 0 14px; }
  .colladd input {
    flex: 1; min-width: 0; padding: 7px 11px;
    background: var(--surface-2); color: var(--text-primary);
    border: 1px solid var(--hairline); border-radius: 10px; font-size: 12.5px; outline: none;
  }
  .colladd input:focus { border-color: rgba(57,135,229,0.65); }
  .coll-new { display: flex; gap: 8px; margin-bottom: 6px; }
  .coll-new input {
    flex: 1; min-width: 0; padding: 8px 12px;
    background: var(--page); color: var(--text-primary);
    border: 1px solid var(--hairline); border-radius: 10px; font-size: 13px; outline: none;
  }
  .coll-new input:focus { border-color: rgba(57,135,229,0.65); }
  .coll-crow { display: flex; align-items: center; gap: 8px; padding: 9px 2px; border-bottom: 1px solid var(--hairline); font-size: 13px; }
  .coll-crow .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .coll-crow.auto .nm { color: var(--text-muted); }
  .coll-crow .cnt { font-size: 11px; color: var(--text-muted); flex: none; }
  .coll-badge { font-size: 10.5px; color: var(--text-muted); border: 1px solid var(--hairline); border-radius: 999px; padding: 1px 7px; flex: none; }
  .coll-crow .btn { padding: 4px 10px; font-size: 12px; }
  .coll-crow input {
    flex: 1; min-width: 0; padding: 5px 9px;
    background: var(--page); color: var(--text-primary);
    border: 1px solid rgba(57,135,229,0.65); border-radius: 8px; font-size: 12.5px; outline: none;
  }
  .note-label { font-size: 12px; color: var(--text-muted); margin: 16px 0 6px; }
  .note {
    font-size: 13.5px; line-height: 1.75; color: var(--text-secondary);
    background: var(--surface-2); border: 1px solid var(--hairline);
    border-radius: 10px; padding: 12px 14px; white-space: pre-wrap; word-break: break-word;
  }
  .panel-actions { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }

  .exlist-item {
    padding: 11px 12px; border: 1px solid var(--hairline); border-radius: 10px;
    margin-bottom: 8px; cursor: pointer; transition: border-color .15s, background .15s;
  }
  .exlist-item:hover { border-color: var(--hoverline); background: var(--surface-2); }
  .exlist-item .q {
    font-size: 13px; line-height: 1.65; color: var(--text-secondary);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    word-break: break-word;
  }
  .exlist-item .m { font-size: 11.5px; color: var(--text-muted); margin-top: 6px; }
  .group-head { display: flex; align-items: center; gap: 8px; margin: 18px 0 8px; }
  .group-head:first-child { margin-top: 8px; }
  .group-head .foldbtn {
    width: 24px; height: 24px; flex: none; border: 1px solid var(--hairline); border-radius: 7px;
    display: grid; place-items: center; background: transparent; color: var(--text-secondary);
    font-size: 12px; line-height: 1; cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }

<script>
'use strict';
/* ============================================================
 * 摘录星图 · 书籍摘录关系云图
 * 单文件 · 零依赖 · 数据经发布管线:本地服务编辑落盘(自动发布)/ 无服务时只读镜像
 * ============================================================ */

/* ---------- 常量与工具 ---------- */
const C = {
  page: '#0d0d0d', surface: '#1a1a19',
  text: '#ffffff', text2: '#c3c2b7', muted: '#898781',
  book: '#3987e5', tag: '#d95926', excerpt: '#199e70',
  edge: '#ffffff', ring: '#ffffff',
  divider: 'rgba(255,255,255,0.09)', text2dim: 'rgba(195,194,183,0.72)', labelchip: 'rgba(13,13,13,0.82)',
};
const TYPE_META = {
  book:    { get color() { return C.book; },    name: '书籍' },
  tag:     { get color() { return C.tag; },     name: '主题' },
  excerpt: { get color() { return C.excerpt; }, name: '摘录' },
};
/* 画布没有 CSS 级联,色板从 CSS 变量读——日夜间切换只翻 :root 的 data-theme,canvas 跟着走 */
const CANVAS_VARS = [
  ['page', '--page'], ['surface', '--surface-1'], ['text', '--text-primary'], ['text2', '--text-secondary'],
  ['muted', '--text-muted'], ['book', '--book'], ['tag', '--tag'], ['excerpt', '--excerpt'],
  ['edge', '--edge'], ['ring', '--ring'], ['divider', '--divider'], ['text2dim', '--text2-dim'], ['labelchip', '--labelchip-bg'],
];
function refreshCanvasPalette() {
  const cs = getComputedStyle(document.documentElement);
  for (const [k, v] of CANVAS_VARS) { const val = cs.getPropertyValue(v).trim(); if (val) C[k] = val; }
}
const withAlpha = (hex, a) => { /* #rrggbb -> rgba 字符串(悬停/选中环按透明度合成);其他格式原样返回 */
  if (/^#[0-9a-fA-F]{6}$/.test(hex)) {
    const n = parseInt(hex.slice(1), 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }
  return hex;
};
/* ---------- 日夜间模式:跟随 suki 站点 ----------
 * 真相 = localStorage['suki.theme'](父页切换按钮写入;head 内联脚本防闪变)。本页无自己的切换按钮:
 * iframe 内由 storage 事件 / 父页 <html data-theme> 观察实时跟随;file:// 直开读同一键。 */
function applyTheme(t) {
  if (t === 'light') document.documentElement.dataset.theme = 'light';
  else delete document.documentElement.dataset.theme;
  refreshCanvasPalette();
  render();
}
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 9));
const truncate = (s, n) => { const c = Array.from(s); return c.length > n ? c.slice(0, n).join('') + '…' : s; };
const fmtDate = (iso) => { try { return new Date(iso).toLocaleDateString('zh-CN'); } catch { return ''; } };
const normBook = (b) => String(b || '').trim().replace(/^《|》$/g, '').trim();

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

/* ---------- 数据层 ----------
 * 双模式(启动时探测一次):
 *   editor —— 本地摘录服务(http://127.0.0.1:8355, server.py)可达:增删改经 PUT 全量写回
 *             excerpts.json,服务端落盘后经钩子自动发布到 suki;
 *   viewer —— 只读镜像:展示发布数据(window.STATIC_DATA.excerpt,来自 data.js),
 *             无任何写路径;线上站与 file:// 直开都是此模式。
 * localStorage 不再存数据——真相在磁盘 excerpts.json 与发布管线里。 */
let state = { excerpts: [], collections: [] };
let editorMode = false;

function publishedExcerpts() {
  try {
    const a = window.STATIC_DATA && window.STATIC_DATA.excerpt && window.STATIC_DATA.excerpt.excerpts;
    return Array.isArray(a) ? a.map(normalizeExcerpt).filter(Boolean) : [];
  } catch (e) { return []; }
}
function publishedCollections() {
  try {
    const a = window.STATIC_DATA && window.STATIC_DATA.excerpt && window.STATIC_DATA.excerpt.collections;
    return Array.isArray(a) ? a.map(normalizeCollection).filter(Boolean) : [];
  } catch (e) { return []; }
}
async function bootStore() {
  try {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 1500);
    const r = await fetch('/api/excerpts', { signal: ctl.signal });
    clearTimeout(timer);
    if (r.ok) {
      const d = await r.json();
      if (d && Array.isArray(d.excerpts)) {
        editorMode = true;
        state.excerpts = d.excerpts.map(normalizeExcerpt).filter(Boolean);
        state.collections = (Array.isArray(d.collections) ? d.collections : []).map(normalizeCollection).filter(Boolean);
        return;
      }
    }
  } catch (e) { /* 无本地服务 → 只读镜像 */ }
  state.excerpts = publishedExcerpts();
  state.collections = publishedCollections();
}
/* 只读镜像热更新:父页面(suki index.html)「检查更新」拉到新发布数据后推进来(colls 旧父页不传则保持原值) */
window.excerptDataUpdate = function (arr, colls) {
  if (editorMode || !Array.isArray(arr)) return;
  state.excerpts = arr.map(normalizeExcerpt).filter(Boolean);
  if (Array.isArray(colls)) state.collections = colls.map(normalizeCollection).filter(Boolean);
  rebuild(false); // 收尾自带 updateStats/refreshDatalists/renderList
  toast('摘录已更新到最新发布版');
};
function normalizeExcerpt(e) {
  if (!e || typeof e.text !== 'string' || typeof e.book !== 'string') return null;
  return {
    id: e.id || uid(),
    text: e.text.trim(),
    book: normBook(e.book),
    author: typeof e.author === 'string' ? e.author.trim() : '',
    tags: Array.isArray(e.tags) ? e.tags.map(t => String(t).trim()).filter(Boolean) : [],
    note: typeof e.note === 'string' ? e.note.trim() : '',
    createdAt: e.createdAt || new Date().toISOString(),
  };
}
function normalizeCollection(c) {
  if (!c || typeof c.name !== 'string') return null;
  const name = c.name.trim();
  if (!name) return null;
  const seen = new Set(), books = [];
  for (const b of (Array.isArray(c.books) ? c.books : [])) {
    if (typeof b !== 'string') continue;
    const t = normBook(b);
    if (!t) continue;
    const k = bookKey(t);
    if (seen.has(k)) continue;
    seen.add(k); books.push(t);
  }
  return { id: c.id || uid(), name, books };
}
let saveTimer = null;
function save() {
  markTabsDirty(); // 数据变更:非活动星图页标脏,切回时按旧布局重建
  if (!editorMode) return; // 只读镜像:没有写路径
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      const r = await fetch('/api/excerpts', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ v: 1, excerpts: state.excerpts, collections: state.collections }),
      });
      if (!r.ok) throw new Error('HTTP ' + r.status);
    } catch (e) { toast('保存失败:本地摘录服务未响应'); }
  }, 250);
}

/* 派生索引 */
function bookKey(t) { return t.toLowerCase(); }
function derive(src) {
  const books = new Map(), tags = new Map();
  for (const e of (src || state.excerpts)) {
    const k = bookKey(e.book);
    if (!books.has(k)) books.set(k, { title: e.book, author: e.author, items: [] });
    const b = books.get(k);
    b.items.push(e);
    if (e.author && !b.author) b.author = e.author;
    for (const t of e.tags) {
      const tk = t.toLowerCase();
      if (!tags.has(tk)) tags.set(tk, { name: t, items: [] });
      tags.get(tk).items.push(e);
    }
  }
  return { books, tags };
}

/* ---------- 合集 ----------
 * 自动合集:同一作者名下的书籍,随摘录数据派生(有作者就建,单书也算),不落盘;
 * 手动合集:state.collections 落盘于 excerpts.json 的 collections 键,成员按原始书名存、按 bookKey 比对。
 * 书被删空后成员串保留(悬空),展示时按现存书籍过滤——书名回来则成员关系自动恢复。 */
function authorCollections() {
  const map = new Map();
  for (const b of derive().books.values()) {
    if (!b.author) continue;
    const k = b.author.toLowerCase();
    if (!map.has(k)) map.set(k, { auto: true, name: b.author, books: [] });
    map.get(k).books.push(b);
  }
  return [...map.values()];
}
function findColl(name) {
  const k = String(name || '').trim().toLowerCase();
  return state.collections.find(c => c.name.toLowerCase() === k) || null;
}
function collHasBook(c, title) { return c.books.some(b => bookKey(b) === bookKey(title)); }
function collAddBook(c, title) { if (!collHasBook(c, title)) c.books.push(normBook(title)); }
function collMembers(f) { // 合集星图成员 bookKey 集:作者合集按作者名派生;手动按 books(悬空成员被现存摘录自然滤除)
  const ks = new Set();
  if (f.auto) {
    const k = f.name.toLowerCase();
    for (const e of state.excerpts) if ((e.author || '').toLowerCase() === k) ks.add(bookKey(e.book));
  } else {
    const want = new Set(f.books.map(bookKey));
    for (const e of state.excerpts) if (want.has(bookKey(e.book))) ks.add(bookKey(e.book));
  }
  return ks;
}

/* ============================================================
 * 图:节点 / 边 / 力导向模拟 / 渲染
 * ============================================================ */
const canvas = $('graph');
const ctx = canvas.getContext('2d');
let dpr = 1, W = 0, H = 0;

let tooltipTarget = null;
/* 活动图状态 G:画布与交互始终作用于 G;非活动标签页持有同构快照对象(见 snapGraph) */
const G = {
  nodes: [], nodeById: new Map(), edges: [],
  alpha: 1, running: false,
  view: { k: 1, ox: 0, oy: 0 },
  hoverId: null, selectedId: null,
  dragNode: null, panning: null, downInfo: null,
  searchQuery: '', searchHits: [],
  focus: null,             // {t1:Set, t2:Set}
  bookView: null,          // 星图面:null=全部;否则为书名,图上只保留该书的摘录与主题
  collView: null,          // 合集星图:null=非合集视图;否则为合集过滤对象(手动合集本体或 {auto:true,name}),图上只保留合集成员的摘录与主题
};

/* ---------- 标签页(多开星图页) ---------- */
const tabs = [];              // {id, snap, dirty}  snap = 该页的图状态快照
let activeTabId = null, tabSeq = 0, splitMode = false;
const tabTitle = (bv, cv) => (cv ? '「' + cv.name + '」' : (bv ? '《' + bv + '》' : '全部星图'));
function freshGraphSnap(book) {
  return {
    nodes: [], nodeById: new Map(), edges: [], alpha: 1, running: false,
    view: { k: 1, ox: 0, oy: 0 }, hoverId: null, selectedId: null,
    dragNode: null, panning: null, downInfo: null,
    searchQuery: '', searchHits: [], focus: null, bookView: book || null, collView: null,
  };
}
function snapGraph() {
  return {
    nodes: G.nodes, nodeById: G.nodeById, edges: G.edges, alpha: G.alpha, running: G.running,
    view: { k: G.view.k, ox: G.view.ox, oy: G.view.oy },
    hoverId: G.hoverId, selectedId: G.selectedId,
    dragNode: null, panning: null, downInfo: null,
    searchQuery: G.searchQuery, searchHits: G.searchHits, focus: G.focus, bookView: G.bookView, collView: G.collView,
  };
}
function restoreGraph(s) {
  G.nodes = s.nodes; G.nodeById = s.nodeById; G.edges = s.edges;
  G.alpha = s.alpha; G.running = false;
  G.view = { k: s.view.k, ox: s.view.ox, oy: s.view.oy };
  G.hoverId = s.hoverId; G.selectedId = s.selectedId;
  G.dragNode = null; G.panning = null; G.downInfo = null;
  G.searchQuery = s.searchQuery; G.searchHits = s.searchHits;
  G.focus = s.focus; G.bookView = s.bookView; G.collView = s.collView;
}
function stepSnap(s) {  // 同屏模式:让非活动页的物理也走下去(临时换入全局 step 再换出)
  const keep = { nodes: G.nodes, edges: G.edges, alpha: G.alpha, view: G.view };
  G.nodes = s.nodes; G.edges = s.edges; G.alpha = s.alpha; G.view = s.view;
  const mv = step();
  s.alpha = G.alpha;
  G.nodes = keep.nodes; G.edges = keep.edges; G.alpha = keep.alpha; G.view = keep.view;
  return mv;
}
function markTabsDirty() { for (const t of tabs) if (t.id !== activeTabId) t.dirty = true; }
function createTab(book) {
  const t = { id: 't' + (++tabSeq), snap: freshGraphSnap(book), dirty: false };
  tabs.push(t);
  return t;
}
function buildTab(t) {  // 用当前数据把该页的图建出来(不激活;同屏与测试钩子用)
  const live = snapGraph();
  restoreGraph(t.snap);
  rebuild(true, true);
  t.snap = snapGraph();                  // 先回写!否则 fitView 的同步 render 重入 renderSplit 时仍判空 → 无限递归
  fitView(false);                        // 同步落位(重建内部的 fitView 是动画式,来不及写进快照)
  cancelAnimationFrame(viewAnim);        // 掐掉动画尾巴,防止它回头改活动页的视图
  t.snap = snapGraph();                  // 把落位后的视图也写回
  restoreGraph(live);
  updateStats(); renderList(); renderTabbar(); // 换入换出会路过 rebuild 的界面刷新,恢复成活动页的状态
}
function curTab() { return tabs.find(t => t.id === activeTabId) || null; }
function switchTab(id) {
  if (id === activeTabId) return;
  const cur = curTab(); if (cur) cur.snap = snapGraph();
  const t = tabs.find(x => x.id === id);
  if (!t) return;
  activeTabId = id;
  activateTab(t);
}
function activateTab(t) {
  closeDetail(); closeList(); hideTooltip();
  const seed = t.dirty ? new Map(t.snap.nodes.map(n => [n.id, n])) : null;
  restoreGraph(t.snap);
  if (t.dirty || !G.nodes.length) rebuild(true, false, seed);
  t.snap = snapGraph();   // 激活即回写:空快照/脏页在此治愈,同屏渲染不会撞到空快照
  t.dirty = false;
  $('search').value = G.searchQuery;
  $('searchCount').textContent = G.searchQuery.trim() ? (G.searchHits.length ? G.searchHits.length + ' 个结果' : '无结果') : '';
  $('bookBack').hidden = !(G.bookView || G.collView);
  computeFocus(); updateStats(); renderList(); renderTabbar(); render(); ensureLoop();
}
function newTab() {
  const cur = curTab(); if (cur) cur.snap = snapGraph();  // 先收好当前页的实时状态(否则丢失,且可能留下空快照)
  const t = createTab(null);
  activeTabId = t.id;
  activateTab(t);   // 空快照触发全量建图
  toast('已新建星图页');
}
function closeTab(id) {
  const i = tabs.findIndex(t => t.id === id);
  if (i < 0) return;
  if (tabs.length === 1) {   // 最后一页:重置为「全部星图」而非关闭
    const t = tabs[0];
    t.snap = freshGraphSnap(null); t.dirty = false;
    if (t.id === activeTabId) activateTab(t); else renderTabbar();
    toast('星图页已重置');
    return;
  }
  tabs.splice(i, 1);
  if (splitMode && tabs.length < 2) toggleSplit(false);
  if (id === activeTabId) {
    const t = tabs[Math.max(0, i - 1)];
    activeTabId = t.id;
    activateTab(t);
  } else renderTabbar();
  toast('已关闭星图页');
}
function renderTabbar() {
  const bar = $('tabs');
  bar.textContent = '';
  for (const t of tabs) {
    const live = t.id === activeTabId;
    const bv = live ? G.bookView : t.snap.bookView, cv = live ? G.collView : t.snap.collView;
    const d = el('div', 'tab' + (live ? ' active' : ''));
    d.title = live ? '当前星图页' : '切换到「' + tabTitle(bv, cv) + '」';
    d.appendChild(el('span', 'tt', tabTitle(bv, cv) + (t.dirty ? ' *' : '')));
    const x = el('span', 'x', '✕');
    x.title = '关闭此页(仅剩一页时为重置)';
    x.onclick = (e) => { e.stopPropagation(); closeTab(t.id); };
    d.appendChild(x);
    d.onclick = () => switchTab(t.id);
    bar.appendChild(d);
  }
  $('tabSplit').disabled = tabs.length < 2;
}
function toggleSplit(force) {
  splitMode = force !== undefined ? force : !splitMode;
  $('tabSplit').classList.toggle('on', splitMode);
  $('tabSplit').textContent = splitMode ? '退出同屏' : '同屏';
  hideTooltip();
  render(); ensureLoop();
}

function resize() {
  /* 触屏强制 ≥2(封顶 3 控内存):部分国产内核/WebView 在 iframe 里谎报 devicePixelRatio=1,
   * 画布按 1 倍渲染再被高分屏拉伸=文字严重模糊;真机 DPR 本就 ≥2 的不受影响 */
  dpr = Math.min(3, Math.max(window.devicePixelRatio || 1, matchMedia('(pointer: coarse)').matches ? 2 : 1));
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  render();
}

/* ---------- 构图 ---------- */
function rebuild(fit, fresh, seed) {
  let src = state.excerpts;
  if (G.bookView) src = state.excerpts.filter(e => bookKey(e.book) === bookKey(G.bookView));
  else if (G.collView) {
    if (!G.collView.auto && !state.collections.some(c => c.id === G.collView.id)) G.collView = null; // 合集被解散/导入替换,退回全部
    else { const ks = collMembers(G.collView); src = state.excerpts.filter(e => ks.has(bookKey(e.book))); }
  }
  if ((G.bookView || G.collView) && !src.length) { G.bookView = null; G.collView = null; $('bookBack').hidden = true; rebuild(true); return; } // 焦点书/合集摘录被删空,退回全部
  const keep = seed ? seed : new Map();
  if (!seed) for (const n of G.nodes) keep.set(n.id, n);
  G.nodes = []; G.nodeById = new Map(); G.edges = [];
  const { books, tags } = derive(src);

  const mk = (id, type, label, ref) => {
    const old = keep.get(id);
    const n = {
      id, type, label, ref,
      x: old ? old.x : 0, y: old ? old.y : 0,
      vx: 0, vy: 0, r: 5, deg: 0,
      pinned: old ? old.pinned : false, fixed: old ? old.fixed : false,
      fx: 0, fy: 0,
    };
    if (old) { n.x = old.x; n.y = old.y; }
    G.nodes.push(n); G.nodeById.set(id, n);
    return n;
  };

  // 书籍与主题节点:初次随机散布在圆环上;星图面(fresh)书籍居中、主题外环
  const ringR = 150 + Math.sqrt(src.length + 2) * 34;
  for (const b of books.values()) {
    const n = mk('b:' + bookKey(b.title), 'book', '《' + b.title + '》', b);
    if (fresh) { n.x = 0; n.y = 0; }
    else if (!keep.has(n.id)) {
      const a = Math.random() * Math.PI * 2;
      n.x = Math.cos(a) * ringR; n.y = Math.sin(a) * ringR;
    }
  }
  for (const t of tags.values()) {
    const n = mk('t:' + t.name.toLowerCase(), 'tag', '#' + t.name, t);
    if (fresh || !keep.has(n.id)) {
      const a = Math.random() * Math.PI * 2;
      n.x = Math.cos(a) * ringR * 1.15; n.y = Math.sin(a) * ringR * 1.15;
    }
  }
  // 摘录节点:新生成的挂在所属书籍附近;星图面(fresh)从书籍周围的圆盘起步
  for (const e of src) {
    const id = 'e:' + e.id;
    const n = mk(id, 'excerpt', truncate(e.text.replace(/\s+/g, ' '), 18), e);
    if (fresh) {
      const a = Math.random() * Math.PI * 2, rr = 30 + Math.random() * 115;
      n.x = Math.cos(a) * rr; n.y = Math.sin(a) * rr;
    } else if (!keep.has(n.id)) {
      const bn = G.nodeById.get('b:' + bookKey(e.book));
      const cx = bn ? bn.x : 0, cy = bn ? bn.y : 0;
      n.x = cx + (Math.random() - 0.5) * 130;
      n.y = cy + (Math.random() - 0.5) * 130;
    }
    G.edges.push({ s: n, t: G.nodeById.get('b:' + bookKey(e.book)), hub: 'book' });
    for (const t of e.tags) {
      const tn = G.nodeById.get('t:' + t.toLowerCase());
      if (tn) G.edges.push({ s: n, t: tn, hub: 'tag' });
    }
  }
  // 半径:书籍按持有摘录数;摘录在星图面内按字数(总览里恒为小星);主题按度数
  for (const e of G.edges) { e.s.deg++; e.t.deg++; }
  // 跨书共享主题标记:同一主题被 ≥2 本书的摘录引用 → 其连边用更长静息长度(step),
  // 让主题悬到书团之间真空的中央,提高每本书的聚合感与书间的独立感
  {
    const tbooks = new Map(); // 主题节点 → 引用它的摘录所属 bookKey 集
    for (const e of G.edges) {
      if (e.hub !== 'tag') continue;
      const t = e.s.type === 'topic' ? e.s : e.t, x = e.s.type === 'topic' ? e.t : e.s;
      if (!tbooks.has(t)) tbooks.set(t, new Set());
      tbooks.get(t).add(bookKey(x.ref.book));
    }
    for (const [t, bs] of tbooks) t.cross = bs.size >= 2;
  }
  for (const n of G.nodes) {
    if (n.type === 'excerpt') {
      if (G.bookView) {
        const chars = Array.from(n.ref.text.replace(/\s+/g, '')).length;
        n.r = clamp(3.6 + Math.sqrt(chars) * 0.62, 4.5, 15);
      } else n.r = 4.5;
    } else if (n.type === 'book') {
      // 对数标尺:低段拉开差距,10 本以上边际递减,20 条封顶(特大者彼此几乎不再变);
      // 极小书下限再降(13.4→11.0),增长率同步调大,1~2 条的小书与较大书区分更明显
      const c = n.ref.items.length;
      n.r = clamp(7 + 19 * Math.log(1 + c / 1.2) / Math.log(1 + 20 / 1.2), 10, 26);
    } else {
      // 主题整体缩小一档(r(2) 9.7→7.8,上限 18→11),仍压过摘录小星、不越过极小书
      n.r = clamp(5 + Math.sqrt(n.deg) * 2.0, 7, 11);
    }
  }

  if (fresh) for (const n of G.nodes) { n.pinned = false; n.fixed = false; } // 星图面重新起盘,原固定标记随之失效

  if (G.selectedId && !G.nodeById.has(G.selectedId)) G.selectedId = null;
  if (G.hoverId && !G.nodeById.has(G.hoverId)) G.hoverId = null;
  computeFocus();
  updateStats();
  refreshDatalists();
  renderList();
  renderTabbar();
  G.alpha = fit ? 1 : Math.max(G.alpha, 0.55);
  if (fit) fitView();
  ensureLoop();
}

/* ---------- 书籍星图面 ---------- */
function enterBookView(title) {
  if (G.bookView && bookKey(G.bookView) === bookKey(title)) return;
  if (!state.excerpts.some(e => bookKey(e.book) === bookKey(title))) return;
  G.bookView = title; G.collView = null;

  G.selectedId = null; G.hoverId = null;

function exitBookView() {

  G.selectedId = null; G.hoverId = null;

}
function enterCollView(f) { // 列表点合集行进入:星图切到该合集内部,列表同步进该合集目录
  const same = G.collView && ((f.auto && G.collView.auto && G.collView.name.toLowerCase() === f.name.toLowerCase())
    || (!f.auto && !G.collView.auto && G.collView.id === f.id));
  if (same) return;
  if (!collMembers(f).size) return; // 空合集(无现存摘录)不进星图
  G.collView = f; G.bookView = null;
  listTab = 'colls'; listCollFilter = f;
  G.selectedId = null; G.hoverId = null;
  G.searchQuery = ''; $('search').value = ''; $('searchCount').textContent = '';
  closeDetail(); toggleMenu(false); // 列表是目录,进合集星图不收起
  $('bookBack').hidden = false;
  rebuild(true, true);
  toast('已进入「' + f.name + '」星图,点「‹ 全部星图」返回');
}
function exitCollView() {
  if (!G.collView) return;
  G.collView = null; listCollFilter = null;
  G.selectedId = null; G.hoverId = null;
  closeDetail(); // 列表保持打开,回到合集目录根
  $('bookBack').hidden = true;
  rebuild(true);
  toast('已返回全部星图');
}

/* ---------- 模拟 ---------- */
function step() {
  const a = G.alpha, nLen = G.nodes.length;
  // 斥力(带截断的 O(n²))+ 轻量碰撞
  for (let i = 0; i < nLen; i++) {
    const n1 = G.nodes[i];
    for (let j = i + 1; j < nLen; j++) {
      const n2 = G.nodes[j];
      let dx = n2.x - n1.x, dy = n2.y - n1.y;
      let d2 = dx * dx + dy * dy;
      const bookPair = n1.type === 'book' && n2.type === 'book';
      if (d2 > (bookPair ? 518400 : 67600)) continue; // 260² 之外不计算;书籍对放宽到 720²(真空带内仍互推,防链条折叠)
      if (d2 < 0.01) { d2 = 1; dx = Math.random() - 0.5; dy = Math.random() - 0.5; }
      const d = Math.sqrt(d2);
      let f = (1200 * (n1.r + n2.r + 12)) / d2 * a;           // 牛顿斥力(弱化:1700→1200),动态更温和
      if (bookPair) f *= 8;                                   // 书籍中枢额外互推:把书团(星云)之间的真空带拉开
      else if (n1.type === 'excerpt' && n2.type === 'excerpt' && n1.ref.book === n2.ref.book) f *= 0.55; // 同书摘抄互斥减弱:星云收紧(碰撞推离仍在,不会重合)
      const minD = n1.r + n2.r + 14;
      if (d < minD) f += (minD - d) * 0.055;                  // 碰撞推离
      else if (d < minD + 36) f += (minD + 36 - d) * 0.00115; // 常驻微弱斥力:不分类型、不随 alpha 衰减,活动期任何节点对都温和互推;峰值力 <0.042,压在停稳阈值下
      const fx = dx / d * f, fy = dy / d * f;
      n1.vx -= fx; n1.vy -= fy; n2.vx += fx; n2.vy += fy;
    }
  }
  // 弹簧(边)
  for (const e of G.edges) {
    const n1 = e.s, n2 = e.t;
    const dx = n2.x - n1.x, dy = n2.y - n1.y;
    const d = Math.sqrt(dx * dx + dy * dy) || 1;
    const crossE = e.s.cross || e.t.cross;                    // 跨书共享主题的边:基础长度加长(+70)、软弹簧 → 主题悬到书间真空中央
    const leafT = e.hub === 'tag' && !crossE && (n1.deg === 1 || n2.deg === 1); // 孤主题(只挂一条摘抄):收紧防拖尾
    const L = n1.r + n2.r + (e.hub === 'book' ? 52 : crossE ? 170 : leafT ? 24 : 30);
    const f = (d - L) * (e.hub === 'book' ? 0.05 : crossE ? 0.03 : leafT ? 0.08 : 0.04) * a; // 书籍/书内边硬(聚合度),跨书边软(伸向中央)
    const fx = dx / d * f, fy = dy / d * f;
    n1.vx += fx; n1.vy += fy; n2.vx -= fx; n2.vy -= fy;
  }
  // 向心 + 积分
  let maxV = 0;
  for (const n of G.nodes) {
    if (n.fixed) { n.x = n.fx; n.y = n.fy; n.vx = 0; n.vy = 0; continue; }
    n.vx -= n.x * 0.0018 * a; n.vy -= n.y * 0.0018 * a;
    n.vx *= 0.85; n.vy *= 0.85;
    n.x += clamp(n.vx, -14, 14); n.y += clamp(n.vy, -14, 14);
    const v = Math.abs(n.vx) + Math.abs(n.vy);
    if (v > maxV) maxV = v;
  }
  G.alpha = Math.max(G.alpha * 0.988, 0.02);
  return maxV;
}

function settled(maxV) { return G.alpha <= 0.021 && maxV < 0.35 && !G.dragNode; }

function frame() {
  const maxV = step();
  let maxV2 = 0;
  if (splitMode && tabs.length > 1) for (const t of tabs) if (t.id !== activeTabId && t.snap.nodes.length) maxV2 = Math.max(maxV2, stepSnap(t.snap));
  render();
  if (settled(maxV) && maxV2 < 0.35) { G.running = false; return; }
  requestAnimationFrame(frame);
}
function ensureLoop() {
  if (!G.running) { G.running = true; requestAnimationFrame(frame); }
}

/* ---------- 焦点(悬停/选中/搜索)分层 ---------- */
function computeFocus() {
  const q = G.searchQuery.trim().toLowerCase();
  if (q) {
    const t1 = new Set(), t2 = new Set();
    for (const n of G.nodes) {
      let hit = false;
      if (n.type === 'excerpt') {
        const e = n.ref;
        hit = e.text.toLowerCase().includes(q) || e.book.toLowerCase().includes(q) ||
              (e.author || '').toLowerCase().includes(q) ||
              e.tags.some(t => t.toLowerCase().includes(q)) || (e.note || '').toLowerCase().includes(q);
      } else hit = n.label.toLowerCase().includes(q);
      if (hit) t1.add(n.id);
    }
    for (const e of G.edges) {
      if (t1.has(e.s.id)) t2.add(e.t.id);
      if (t1.has(e.t.id)) t2.add(e.s.id);
    }
    G.searchHits = G.nodes.filter(n => t1.has(n.id));
    G.focus = { t1, t2 };
  } else {
    G.searchHits = [];
    const id = G.hoverId || G.selectedId;
    if (id && G.nodeById.has(id)) {
      const t1 = new Set([id]), t2 = new Set();
      for (const e of G.edges) {
        if (e.s.id === id) { t2.add(e.t.id); }
        if (e.t.id === id) { t2.add(e.s.id); }
      }
      G.focus = { t1, t2 };
    } else G.focus = null;
  }
}
/* ---------- 渲染 ---------- */
/* drawView:把一份图状态画到 ctx 的 [x0, x0+w] 竖条内(主画布 x0=0;同屏模式每页一条) */
function drawView(nodes, nodeById, edges, view, focus, selId, hovId, ctx2, w, h, x0) {
  ctx2.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx2.fillStyle = C.page;
  ctx2.fillRect(x0, 0, w, h);
  ctx2.save();
  ctx2.beginPath(); ctx2.rect(x0, 0, w, h); ctx2.clip(); // 同屏切片互不越界
  if (nodes.length) {
  const tier = (id) => {
    if (!focus) return 1;
    if (focus.t1.has(id)) return 1;
    if (focus.t2.has(id)) return 0.38;
    return 0.13;
  };

  const { k, ox, oy } = view;

  /* --- 世界坐标层:边 --- */
  ctx2.setTransform(dpr * k, 0, 0, dpr * k, dpr * (ox + x0), dpr * oy);
  ctx2.lineCap = 'round';
  for (const e of edges) {
    const ts = tier(e.s.id), tt = tier(e.t.id);
    const isHot = focus && focus.t1.has(selId || hovId) && (e.s.id === (selId || hovId) || e.t.id === (selId || hovId)) && Math.min(ts, tt) > 0.5;
    let a, color, wdt;
    if (isHot) { a = 0.85; color = TYPE_META[e.hub].color; wdt = 2 / k; }
    else if (!focus) { a = 0.10; color = C.edge; wdt = 1 / k; }
    else if (ts === 1 && tt === 1) { a = 0.5; color = C.edge; wdt = 1.4 / k; }
    else if (ts === 1 || tt === 1) { a = 0.22; color = C.edge; wdt = 1 / k; }
    else if (ts > 0.2 && tt > 0.2) { a = 0.14; color = C.edge; wdt = 1 / k; }
    else { a = 0.05; color = C.edge; wdt = 1 / k; }
    ctx2.globalAlpha = a;
    ctx2.strokeStyle = color;
    ctx2.lineWidth = wdt;
    ctx2.beginPath(); ctx2.moveTo(e.s.x, e.s.y); ctx2.lineTo(e.t.x, e.t.y); ctx2.stroke();
  }

  /* --- 世界坐标层:节点 --- */
  for (const n of nodes) {
    const t = tier(n.id);
    ctx2.globalAlpha = t;
    // 表面色描边(2px 表面环,重叠处保持可辨)
    ctx2.beginPath();
    if (n.type === 'tag') {
      const r = n.r * 1.16;
      ctx2.moveTo(n.x, n.y - r); ctx2.lineTo(n.x + r, n.y); ctx2.lineTo(n.x, n.y + r); ctx2.lineTo(n.x - r, n.y);
      ctx2.closePath();
    } else {
      ctx2.arc(n.x, n.y, n.r, 0, 6.2832);
    }
    ctx2.fillStyle = TYPE_META[n.type].color;
      ctx2.strokeStyle = C.page;
      ctx2.lineWidth = 2 / k;
      ctx2.stroke();
    ctx2.fill();
  }
  // 悬停 / 选中 外环
  ctx2.globalAlpha = 1;
  for (const [id, colr, wd] of [[hovId, withAlpha(C.ring, 0.5), 1.4], [selId, withAlpha(C.ring, 0.9), 1.8]]) {
    if (!id || !nodeById.has(id)) continue;
    const n = nodeById.get(id);
    ctx2.strokeStyle = colr; ctx2.lineWidth = wd / k;
    ctx2.beginPath(); ctx2.arc(n.x, n.y, n.r + 5 / k, 0, 6.2832); ctx2.stroke();
  }

  /* --- 屏幕坐标层:标签 --- */
  ctx2.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx2.font = '500 12px system-ui, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif'; // 整数像素字号,小字栅格更锐
  ctx2.textBaseline = 'middle';
  ctx2.textAlign = 'left';
  const strongId = hovId || selId;
  for (const n of nodes) {
    const t = tier(n.id);
    const hot = n.id === strongId;
    const show = focus ? (t === 1) : (n.type === 'excerpt' ? k >= 1.8 : (k >= 0.55 || n.deg > 0 && k >= 0.4));
    if (!show) continue;
    const px = n.x * k + ox + x0, py = n.y * k + oy;
    if (px < x0 - 24 || px > x0 + w + 24 || py < -24 || py > h + 24) continue; // 视口外不画,免得收进后出现无主标签
    const txt = hot && n.type === 'excerpt' ? truncate(n.ref.text.replace(/\s+/g, ' '), 24) : n.label;
    let lx = px + n.r * k + 7;
    const tw = ctx2.measureText(txt).width;
    if (lx + tw > x0 + w - 8) lx = x0 + w - 8 - tw;   // 右缘收进,窄屏不再越界
    if (lx < x0 + 8) lx = x0 + 8;
    const ly = Math.max(10, Math.min(h - 10, py));   // 上下缘同理收进
    const lxq = Math.round(lx * dpr) / dpr, lyq = Math.round(ly * dpr) / dpr; // 锚点对齐设备像素网格,亚像素渲染发虚
    ctx2.globalAlpha = t;
    ctx2.lineWidth = 3.2; ctx2.strokeStyle = withAlpha(C.page, 0.88); ctx2.lineJoin = 'round'; // 标签光晕=页面底色,随主题翻转
    ctx2.strokeText(txt, lxq, lyq);
    ctx2.fillStyle = hot ? C.text : C.text2;
    ctx2.fillText(txt, lxq, lyq);
  }
  ctx2.globalAlpha = 1;
  }
  ctx2.restore();
}

let rendering = false;
function render() {
  if (rendering) return;   // 重入保险(buildTab→fitView(false)→render 会重入同屏渲染)
  syncUnpin();
  if (splitMode && tabs.length > 1) { rendering = true; try { renderSplit(); } finally { rendering = false; } return; }
  drawView(G.nodes, G.nodeById, G.edges, G.view, G.focus, G.selectedId, G.hoverId, ctx, W, H, 0);
}

/* 「释放所有固定节点」按钮:有固定节点才可点(计数缓存,避免每帧碰 DOM);同屏只读一律禁用 */
let unpinLast = -1;
function syncUnpin() {
  const cnt = splitMode ? 0 : G.nodes.reduce((a, n) => a + ((n.fixed || n.pinned) ? 1 : 0), 0);
  if (cnt === unpinLast) return;
  unpinLast = cnt;
  $('unpinAll').disabled = !cnt;
}

function releaseAllPins() {
  const cnt = G.nodes.reduce((a, n) => a + ((n.fixed || n.pinned) ? 1 : 0), 0);
  if (!cnt) { toast('当前没有固定节点'); return; }
  for (const n of G.nodes) { n.pinned = false; n.fixed = false; }
  G.alpha = 0.8;
  ensureLoop();
  syncUnpin();
  toast('已释放 ' + cnt + ' 个固定节点');
}

/* 同屏模式:各标签页并排为竖条(至多 4 页),各自独立物理与视图;画布只读(交互暂停) */
function renderSplit() {
  const list = tabs.slice(0, 4);
  const n = list.length;
  const tb = document.querySelector('.topbar');
  const labelY = (tb ? tb.getBoundingClientRect().bottom : 60) + 24;
  for (let i = 0; i < n; i++) {
    const t = list[i];
    const isActive = t.id === activeTabId;
    if (!isActive && !t.snap.nodes.length && state.excerpts.length) buildTab(t);
    const x0 = Math.round(i * W / n), x1 = Math.round((i + 1) * W / n), w = x1 - x0;
    if (isActive) {
      drawView(G.nodes, G.nodeById, G.edges, sliceView(G.nodes, w), G.focus, G.selectedId, G.hoverId, ctx, w, H, x0);
    } else {
      stepSnap(t.snap);
      const s = t.snap;
      drawView(s.nodes, s.nodeById, s.edges, sliceView(s.nodes, w), s.focus, s.selectedId, s.hoverId, ctx, w, H, x0);
    }
    // 页名小签 + 分隔线
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.font = '600 12px system-ui, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const title = (isActive ? '● ' : '') + tabTitle(isActive ? G.bookView : t.snap.bookView, isActive ? G.collView : t.snap.collView) + (t.dirty ? ' *' : '');
    const tw = ctx.measureText(title).width;
    ctx.fillStyle = C.labelchip;
    ctx.fillRect(x0 + w / 2 - tw / 2 - 10, labelY - 11, tw + 20, 22);
    ctx.fillStyle = isActive ? C.text : C.text2dim;
    ctx.fillText(title, x0 + w / 2, labelY);
    if (i) { ctx.fillStyle = C.divider; ctx.fillRect(x0 - 0.5, 0, 1, H); }
  }
  ctx.textAlign = 'left';
  ctx.globalAlpha = 1;
}

/* ---------- 视图控制 ---------- */
/* 顶栏(含标签行)实际占用的顶部空间,fitView/centerOn 让图形避开它 */
function chromeTopInset() {
  const tb = document.querySelector('.topbar');
  return tb ? tb.getBoundingClientRect().height + 22 : 90;
}
/* 可视区中心:扣除已打开侧栏宽度(详情靠右 / 列表靠左),聚焦节点落在真正可见的中央 */
function viewCenter() {
  const pw = Math.min(400, W);
  let left = 0, right = W;
  if ($('detailPanel').classList.contains('open')) right -= pw;
  if ($('listPanel').classList.contains('open')) left += pw;
  if (right - left < 120) { left = 0; right = W; } // 窄屏侧栏近全宽,退回整幅
  return { cx: (left + right) / 2, left, right };
}
function fitView(animated = true) {
  if (!G.nodes.length) { G.view = { k: 1, ox: W / 2, oy: H / 2 }; render(); return; }
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const n of G.nodes) {
    x0 = Math.min(x0, n.x - n.r); y0 = Math.min(y0, n.y - n.r);
    x1 = Math.max(x1, n.x + n.r); y1 = Math.max(y1, n.y + n.r);
  }
  const pad = 110, inset = chromeTopInset();
  const vc = viewCenter();
  const k = clamp(Math.min((vc.right - vc.left) / (x1 - x0 + pad * 2), (H - inset - 60) / (y1 - y0 + pad * 2)), 0.2, 1.5);
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  animateView({ k, ox: vc.cx - cx * k, oy: (inset + H) / 2 - cy * k }, animated);
}
/* 同屏模式:为一片宽 w 的切片现场算适配视图(不改各页存储的视图) */
function sliceView(nodes, w) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const n of nodes) {
    x0 = Math.min(x0, n.x - n.r); y0 = Math.min(y0, n.y - n.r);
    x1 = Math.max(x1, n.x + n.r); y1 = Math.max(y1, n.y + n.r);
  }
  const pad = 110, inset = chromeTopInset();
  const k = clamp(Math.min(w / (x1 - x0 + pad * 2), (H - inset - 60) / (y1 - y0 + pad * 2)), 0.2, 1.5);
  return { k, ox: w / 2 - (x0 + x1) / 2 * k, oy: (inset + H) / 2 - (y0 + y1) / 2 * k };
}
let viewAnim = null;
function animateView(target, animated = true) {
  if (!animated) { G.view = { ...target }; render(); ensureLoop(); return; }
  const from = { ...G.view }, t0 = performance.now(), dur = 260;
  cancelAnimationFrame(viewAnim);
  const tick = (t) => {
    const p = clamp((t - t0) / dur, 0, 1), e = 1 - Math.pow(1 - p, 3);
    G.view = {
      k: from.k + (target.k - from.k) * e,
      ox: from.ox + (target.ox - from.ox) * e,
      oy: from.oy + (target.oy - from.oy) * e,
    };
    render();
    if (p < 1) viewAnim = requestAnimationFrame(tick);
  };
  viewAnim = requestAnimationFrame(tick);
}
function centerOn(node) {
  const { cx } = viewCenter();
  const k = Math.max(G.view.k, 0.9);
  animateView({ k, ox: cx - node.x * k, oy: (chromeTopInset() + H) / 2 - node.y * k });
}
function zoomAt(factor, mx, my) {
  const k2 = clamp(G.view.k * factor, 0.18, 3.4);
  const r = k2 / G.view.k;
  G.view.ox = mx - (mx - G.view.ox) * r;
  G.view.oy = my - (my - G.view.oy) * r;
  G.view.k = k2;
  render(); ensureLoop();
}

/* ---------- 指针交互 ---------- */
/* 拖放落位:把节点滑出与邻居的完全重叠(固定节点不受力,叠住的重叠物理解不开,只能落位时摆正) */
function unstack(n0) {
  for (let pass = 0; pass < 3; pass++) {
    let hit = false;
    for (const o of G.nodes) {
      if (o === n0) continue;
      let dx = n0.x - o.x, dy = n0.y - o.y, dd = Math.hypot(dx, dy);
      if (dd < 0.01) { const a0 = Math.random() * 6.2832; dx = Math.cos(a0); dy = Math.sin(a0); dd = 1; }
      const want = n0.r + o.r + 16;
      if (dd < want) {
        n0.x = o.x + dx / dd * want;
        n0.y = o.y + dy / dd * want;
        n0.fx = n0.x; n0.fy = n0.y;
        hit = true;
      }
    }
    if (!hit) return;
  }
}
function toLocal(ev) { return { mx: ev.clientX, my: ev.clientY }; }
function toWorld(mx, my) { return { x: (mx - G.view.ox) / G.view.k, y: (my - G.view.oy) / G.view.k }; }
function nodeAt(mx, my) {
  let best = null, bd = 1e9;
  for (const n of G.nodes) {
    const dx = mx - (n.x * G.view.k + G.view.ox), dy = my - (n.y * G.view.k + G.view.oy);
    const d = Math.hypot(dx, dy);
    const th = Math.max(24, n.r * G.view.k + 6);
    if (d < th && d < bd) { bd = d; best = n; }
  }

/* 触屏多点手势:两指=捏合缩放(绕两指中点)+中点位移=平移;三指以上不处理 */
const touches = new Map(); // pointerId -> {x, y}
function pinchNow() {
  const [a, b] = [...touches.values()];
  return { dist: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
}
function releasePinchHold() { // "落指即固定"的拖拽节点归还自由(本来就 pin 着的保持原状)
  if (G.dragNode) {
    G.dragNode.fixed = !!G.dragNode.pinned;
    G.dragNode.fx = null; G.dragNode.fy = null;
    G.dragNode = null;
  }
}
canvas.addEventListener('pointerdown', (ev) => {
  if (splitMode) return; // 同屏:画布只读
  canvas.setPointerCapture(ev.pointerId);
  touches.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  if (touches.size === 2) { // 第二根手指落下:撤销单指语义,进入捏合
    releasePinchHold();
    G.panning = null; G.downInfo = null;
    canvas.classList.remove('grabbing');
    hideTooltip();
    G.pinch = pinchNow();
    return;
  }
  if (touches.size > 2) return;
  const { mx, my } = toLocal(ev);
  const n = nodeAt(mx, my);
  G.downInfo = { x: ev.clientX, y: ev.clientY, moved: false, hit: !!n };
  if (n) {
    G.dragNode = n;
    n.fixed = true; n.fx = n.x; n.fy = n.y;
  } else {
    G.panning = { ox: G.view.ox, oy: G.view.oy, x: ev.clientX, y: ev.clientY };
    canvas.classList.add('grabbing');
  }
});
canvas.addEventListener('pointermove', (ev) => {
  if (splitMode) { if (G.hoverId) { G.hoverId = null; computeFocus(); render(); } hideTooltip(); return; }
  if (touches.has(ev.pointerId)) touches.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  if (G.pinch) {
    if (touches.size < 2) return;
    const s = pinchNow();
    if (G.pinch.dist > 8) zoomAt(s.dist / G.pinch.dist, s.mx, s.my); // 两指快叠拢时只平移不缩放(防抖)
    G.view.ox += s.mx - G.pinch.mx;
    G.view.oy += s.my - G.pinch.my;
    render();
    G.pinch = s;
    return;
  }
  const { mx, my } = toLocal(ev);
  if (G.dragNode) {
    if (G.downInfo && Math.hypot(ev.clientX - G.downInfo.x, ev.clientY - G.downInfo.y) > 3) G.downInfo.moved = true;
    const w = toWorld(mx, my);
    G.dragNode.fx = w.x; G.dragNode.fy = w.y;
    G.alpha = Math.max(G.alpha, 0.38);
    ensureLoop();
    return;
  }
  if (G.panning) {
    if (G.downInfo && Math.hypot(ev.clientX - G.downInfo.x, ev.clientY - G.downInfo.y) > 3) G.downInfo.moved = true;
    G.view.ox = G.panning.ox + (ev.clientX - G.panning.x);
    G.view.oy = G.panning.oy + (ev.clientY - G.panning.y);
    render();
    return;
  }
  // 悬停
  const n = nodeAt(mx, my);
  const id = n ? n.id : null;
  canvas.classList.toggle('pointing', !!n);
  if (id !== G.hoverId) {
    G.hoverId = id;
    computeFocus();
    render();
  }

    showTooltip(n, ev.clientX, ev.clientY);
  } else hideTooltip();
});
canvas.addEventListener('pointerup', (ev) => {
  canvas.classList.remove('grabbing');
  touches.delete(ev.pointerId);

    if (touches.size < 2) { G.pinch = null; touches.clear(); G.panning = null; G.downInfo = null; }
    return;
  }
  if (G.dragNode) {
    if (G.downInfo && !G.downInfo.moved) {
      selectNode(G.dragNode);
    } else {
      const n0 = G.dragNode;
      unstack(n0);
      n0.pinned = true;
      G.alpha = Math.max(G.alpha, 0.25);
      ensureLoop();
    }
    G.dragNode = null;
  } else if (G.panning && G.downInfo && !G.downInfo.moved) {
    // 点击空白:取消选中
    if (G.selectedId) { G.selectedId = null; closeDetail(); computeFocus(); render(); }
  }
  G.panning = null;
  G.downInfo = null;
});
canvas.addEventListener('pointercancel', (ev) => { // 系统接管手势(来电/边缘滑动等):等同松手但不算点击
  touches.delete(ev.pointerId);
  if (G.pinch && touches.size < 2) { G.pinch = null; touches.clear(); }
  releasePinchHold();
  G.panning = null; G.downInfo = null;
  canvas.classList.remove('grabbing');
});
